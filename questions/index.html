<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매일메일 면접 질문</title>

  <!-- 테마 깜빡임 방지 (localStorage는 테마 전용) -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 마크다운 파서 및 Prism.js: 버전을 고정하고, CDN 파일이 바뀌면 실행하지 않도록 integrity로 검사한다 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" integrity="sha384-06z5D//U/xpvxZHuUz92xBvq3DqBBFi7Up53HRrbV7Jlv7Yvh/MZ7oenfUe9iCEt" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js" integrity="sha384-D44bgYYKvaiDh4cOGlj1dbSDpSctn2FSUj118HZGmZEShZcO2v//Q5vvhNy206pp" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js" integrity="sha384-PeOqKNW/piETaCg8rqKFy+Pm6KEk7e36/5YZE5XO/OaFdO+/Aw3O8qZ9qDPKVUgx" crossorigin="anonymous"></script>
  <!-- 답변 코드 블록에 쓰인 나머지 언어들. jsx는 javascript 뒤, tsx는 jsx와 typescript 뒤에 와야 한다 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js" integrity="sha384-nnKpKrv4RkNTjD3hNwkWsmHW8LBti5JWyAWAgeo8iC4QkFQn2Yn2Kj4mOTTNoI9V" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-tsx.min.js" integrity="sha384-ZzE8Y/KUKzSD+AEsQQvM2PdJSEVs/T/6LE/nSetJ0ReWEE/ZgpKNBSUkTRI3Dc7E" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js" integrity="sha384-RhrmFFMb0ZCHImjFMpR/UE3VEtIVTCtNrtKQqXCzqXZNJala02N3UbVhi+qzw3CY" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-graphql.min.js" integrity="sha384-CfAKPApbQPXLiw2NZvvX89i+xd8VKHk+TfWhnWgmUXxl8Ct6qPN7u30+ATfxibjS" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js" integrity="sha384-/MKWdycCDliku23mP5sYXbZNuXrzgmQO/jsVxwPFn99dVOaXRyKsqDjarqpueGAp" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js" integrity="sha384-DioAMZB4yk91W6LuFit5wJDh8c5Ov09f/MBvja94y0PodMqTpTZeBeejqpRUru7D" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js" integrity="sha384-AKAiycghK0jDCjD+aavMHzDkLzRR7Yzcwh3+xL/295cvyVMe+cxQfyQC8xxGGcI8" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sass.min.js" integrity="sha384-vtpsGXKlAgv7RZuBJVa1roUNFN9110ZNgbj9o6S42DEC9jn43k4IHYtkqaoOODTS" crossorigin="anonymous"></script>

  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../memo.css">
  <!-- 배포 직후 캐시가 섞여 학습 기록 모듈이 멈추면 한 번 새로 받아 고친다 -->
  <script defer src="../module-guard.js"></script>

  <style>
    /* 질문 화면: 답변을 읽고(본문) → 이해도를 표시하고 → 내 언어로 정리하는(학습 기록) 한 장의 문서 */

    /* ---------- 문서 지면 ---------- */
    .page-wrapper {
      max-width: 820px;
      margin: 20px auto 72px;
      padding: 0 20px;
    }

    .doc-container {
      background: var(--bg-paper);
      border-radius: 2px;
      box-shadow: var(--paper-shadow);
      padding: 52px 72px 44px;
    }

    /* 문서 머리: 분류(+ 별표) → 제목 → 내 학습 상태 → 머리 구분선 */
    .doc-header {
      padding-bottom: 26px;
      border-bottom: 1px solid var(--rule-strong);
      margin-bottom: 36px;
    }

    .doc-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin-bottom: 12px;
    }

    .doc-meta {
      min-width: 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .star-toggle {
      margin-right: -9px;
      color: var(--text-muted);
    }

    .star-toggle[aria-pressed="true"],
    .star-toggle[aria-pressed="true"]:hover { color: var(--star); }
    .star-toggle[aria-pressed="true"] svg { fill: currentColor; }

    h1#question-title {
      font-size: 27px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      line-height: 1.45;
      letter-spacing: -0.025em;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 지금 학습 상태: 기록한 것이 있을 때만 보인다(미학습이면 질문 목록처럼 표시하지 않는다). 누르면 학습 기록으로 내려간다.
       학습 수준은 색이 뜻이라 색칠한 표시로, 메모는 질문 목록의 메모 줄처럼 면 없는 글자 링크로 둔다 */
    .doc-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      margin-top: 16px;
    }

    .doc-status .level-badge { transition: box-shadow 0.15s; }
    .doc-status .level-badge:hover { box-shadow: inset 0 0 0 1px currentColor; }

    .status-memo {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      text-underline-offset: 3px;
      white-space: nowrap;
    }

    .status-memo svg { color: var(--primary); }
    .status-memo:hover { color: var(--text-main); text-decoration: underline; }

    /* ---------- 본문 마크다운 타이포그래피 ---------- */
    #content {
      font-size: 16px;
      line-height: 1.85;
      color: var(--text-sub);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    #content > *:first-child { margin-top: 0; }
    #content > *:last-child { margin-bottom: 0; }

    #content h2 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      margin: 48px 0 14px;
      color: var(--text-main);
    }

    #content h3 {
      font-size: 17px;
      font-weight: 700;
      margin: 32px 0 10px;
      color: var(--text-main);
    }

    #content h4 {
      font-size: 15.5px;
      font-weight: 600;
      margin: 24px 0 8px;
      color: var(--text-main);
    }

    #content p { margin: 18px 0; }
    #content strong { font-weight: 700; color: var(--text-main); }
    #content ul, #content ol { padding-left: 22px; margin: 18px 0; }
    #content li { margin-bottom: 6px; }
    #content li::marker { color: var(--text-muted); }
    #content img { max-width: 100%; }

    #content hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 36px 0;
    }

    /* 인용구: 왼쪽 세로줄만 */
    #content blockquote {
      margin: 22px 0;
      padding: 2px 0 2px 18px;
      border-left: 2px solid var(--rule-strong);
      color: var(--text-muted);
    }

    #content blockquote > :first-child { margin-top: 0; }
    #content blockquote > :last-child { margin-bottom: 0; }

    /* 표: 위·아래 굵은 선과 머리 아래 선만 두는 문서식 표 */
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 28px 0;
      font-size: 14.5px;
      line-height: 1.65;
      border-top: 1.5px solid var(--text-main);
      border-bottom: 1.5px solid var(--text-main);
    }

    #content th {
      padding: 10px 14px;
      border-bottom: 1px solid var(--rule-strong);
      text-align: left;
      font-weight: 600;
      color: var(--text-main);
    }

    #content td {
      padding: 10px 14px;
      text-align: left;
      vertical-align: top;
    }

    #content tbody tr + tr td { border-top: 1px solid var(--rule); }

    #content code:not(pre code) {
      background: var(--code-inline-bg);
      color: var(--code-inline-color);
      padding: 2px 5px;
      border-radius: 2px;
      font-size: 0.86em;
      font-family: var(--mono);
    }

    /* 코드 블록: 테두리 없이 옅은 면으로만 구분 */
    .code-wrapper {
      position: relative;
      margin: 24px 0;
    }

    #content pre {
      background-color: var(--code-block-bg);
      border-radius: 3px;
      padding: 18px 20px;
      overflow-x: auto;
      margin: 0;
      color: var(--code-block-text);
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.65;
      tab-size: 2;
    }

    #content pre code {
      font-family: inherit;
      color: inherit;
    }

    /* 코드 복사 버튼: 코드에 손을 올렸을 때만 표시 */
    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 2px;
      cursor: pointer;
      user-select: none;
      opacity: 0;
      transition: opacity 0.15s, background-color 0.15s, color 0.15s;
    }

    .code-wrapper:hover .code-copy-btn,
    .code-copy-btn:focus-visible,
    .code-copy-btn.copied { opacity: 1; }

    .code-copy-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .code-copy-btn.copied { color: var(--primary); }

    /* 터치 화면에서는 복사 버튼이 늘 보이므로, 코드 첫 줄을 가리지 않게 위쪽에 버튼 자리를 띄운다 */
    @media (hover: none) {
      .code-copy-btn { opacity: 1; }
      #content .code-wrapper pre { padding-top: 38px; }
    }

    #content a {
      color: var(--primary);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* ---------- 학습 기록: 본문 뒤에 구분선으로 나눈 문서의 마지막 절. 이해도 → 내 메모 순서로 둔다 ---------- */
    .study {
      margin-top: 64px;
      padding-top: 28px;
      border-top: 1px solid var(--rule-strong);
    }

    .study,
    .study-block { scroll-margin-top: calc(var(--nav-height) + 16px); }

    /* 무엇을 하라는 설명은 빈 메모 칸의 안내 문구가 대신한다 (같은 말을 두 번 하지 않는다) */
    .study-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 16px;
      margin-bottom: 24px;
    }

    .study-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text-main);
    }

    .study-sync {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 8px;
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .study-sync .sync-dot { margin-right: -2px; }
    .study-sync[data-state="error"] .memo-account { color: var(--danger); }

    .study-block + .study-block { margin-top: 32px; }

    .study-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin-bottom: 10px;
    }

    .study-block-title {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .study-block-hint {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* 이해도: 셋 중 하나를 고르는 분할 버튼. 고른 칸만 종이처럼 떠오르고 수준의 색을 띤다 */
    .level-control {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border-radius: 6px;
      background: var(--bg-subtle);
      box-shadow: inset 0 0 0 1px var(--rule);
    }

    .level-option {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .level-option:hover { color: var(--text-main); }
    .level-option:not([aria-checked="true"]) .dot { opacity: 0.55; }

    .level-option[aria-checked="true"] {
      background: var(--bg-paper);
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(20, 23, 26, 0.1), 0 0 0 1px var(--rule);
    }

    .level-option[data-level="review"][aria-checked="true"] { color: var(--review); }
    .level-option[data-level="done"][aria-checked="true"] { color: var(--primary); }

    .level-option:focus-visible { outline-offset: -2px; }

    .memo-loading {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ---------- 문서 꼬리: 이전 / 다음 질문 ---------- */
    .doc-pagination {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
    }

    .page-nav-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      text-decoration: none;
    }

    .page-nav-card.next { text-align: right; }

    .page-nav-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .page-nav-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-underline-offset: 3px;
    }

    .page-nav-card:hover .page-nav-title { text-decoration: underline; }

    /* 오류 안내 */
    .doc-error {
      padding: 2px 0 2px 16px;
      border-left: 2px solid var(--danger);
    }

    .doc-error p { margin: 0; }
    .doc-error .doc-error-title { color: var(--danger); font-weight: 600; }
    .doc-error .doc-error-hint { margin-top: 6px; font-size: 14px; color: var(--text-muted); }

    .skeleton-title { width: 70%; height: 30px; }
    .skeleton-line { height: 15px; margin-bottom: 14px; }

    @media (max-width: 640px) {
      .nav-brand span:not(.brand-dot) { display: none; }
      .page-wrapper { margin: 0; padding: 0; }
      .doc-container {
        border-radius: 0;
        box-shadow: none;
        padding: 28px 20px 28px;
      }
      h1#question-title { font-size: 23px; }
      #content { font-size: 15.5px; }
      .study { margin-top: 48px; }
      .study-head { flex-direction: column; align-items: flex-start; }
      .level-control {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
      }
      .level-option { padding: 0 8px; }
      .doc-pagination { grid-template-columns: 1fr; gap: 16px; }
      .page-nav-card.next { text-align: left; }
      #content table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }

    /* 확인 창의 세 번째 버튼(예: 변경 버리기)은 왼쪽 끝에 빨간 글씨로 둔다 */
    .confirm-buttons .confirm-alt { margin-right: auto; color: var(--danger); }

    /* 인쇄: 지면만 남긴다 */
    @media print {
      body { background: #ffffff; }
      .top-nav, .star-toggle, .doc-status, .study, .doc-pagination, .code-copy-btn, .toast { display: none !important; }
      .page-wrapper { max-width: none; margin: 0; padding: 0; }
      .doc-container { box-shadow: none; padding: 0; }
      #content pre { white-space: pre-wrap; }
    }
  </style>
</head>
<body>

  <!-- 상단 내비게이션 바 -->
  <header class="top-nav">
    <nav class="nav-breadcrumbs" aria-label="경로 탐색">
      <a class="nav-brand q-link" href="../">
        <span class="brand-dot"></span>
        <span>매일메일</span>
      </a>
      <span class="nav-separator">/</span>
      <a class="nav-link q-link" href="../">질문 목록</a>
      <span class="nav-separator">/</span>
      <span class="nav-current" id="nav-q-id">...</span>
    </nav>

    <div class="nav-actions">
      <button type="button" class="btn" id="btn-share" title="질문 링크 복사">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>공유</span>
      </button>

      <button id="theme-toggle" class="btn btn-icon" aria-label="테마 전환" type="button" title="테마 전환">
        <svg class="moon-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- 문서 지면 -->
  <main class="page-wrapper">
    <article class="doc-container">
      <header class="doc-header">
        <div class="doc-meta-row">
          <div id="doc-meta" class="doc-meta">면접 질문</div>
          <button type="button" id="star-toggle" class="btn btn-sm star-toggle" aria-pressed="false" hidden>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">

  <script>
    function initTheme() {
      const toggleBtn = document.getElementById('theme-toggle');
      toggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        if (next === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    let toastTimer = 0;

    function showToast(message, tone = 'info', duration = 2200) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.dataset.tone = tone;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // 본문을 다 그리면 질문 번호와 제목을 넘겨준다 (학습 기록 스크립트가 이것을 기다렸다가 학습 기록을 연다)
    let resolveQuestion;
    window.questionReady = new Promise((resolve) => { resolveQuestion = resolve; });

    const AREAS = {
      fe: { dir: 'frontend', name: '프론트엔드' },
      be: { dir: 'backend', name: '백엔드' },
    };

    // 카테고리 목차(toc-category.md)에서 이 질문이 든 카테고리 이름을 찾는다. 못 찾으면 빈 문자열
    function categoryOf(categoryToc, id) {
      let current = '';
      for (const line of categoryToc.split('\n')) {
        const heading = line.match(/^##\s+(.+)/);
        if (heading) current = heading[1].trim();
        else if (line.includes(`(contents/${id}.md)`)) return current;
      }
      return '';
    }

    async function loadContent() {
      const params = new URLSearchParams(window.location.search);
      let q = params.get('q') || 'fe-1';
      // 접두어 없는 옛 링크(?q=1)는 프론트엔드 질문으로 본다
      if (!/^(fe|be)-/.test(q)) q = 'fe-' + q;

      document.getElementById('nav-q-id').innerText = q.toUpperCase();

      try {
        // 질문 번호 형식만 받는다 (경로 문자로 다른 파일을 읽지 못하도록)
        const match = q.match(/^(fe|be)-\d+$/);
        if (!match) throw new Error("잘못된 질문 번호입니다.");
        const area = AREAS[match[1]];
        document.getElementById('doc-meta').innerText = `${area.name} 면접 질문`;

        const [tocRes, contentRes, categoryText] = await Promise.all([
          fetch(`../${area.dir}/toc.md`),
          fetch(`../${area.dir}/contents/${q}.md`),
          fetch(`../${area.dir}/toc-category.md`).then((res) => (res.ok ? res.text() : '')).catch(() => ''),
        ]);

        if (!contentRes.ok) throw new Error("답변 파일을 찾을 수 없습니다.");

        const tocText = await tocRes.text();
        const contentMd = await contentRes.text();

        // 이전/다음 질문은 같은 영역의 목차 순서를 따른다
        const allQuestions = [...tocText.matchAll(new RegExp(`-\\s*\\[(.*?)\\]\\(contents\\/(${match[1]}-\\d+)\\.md\\)`, 'g'))]
          .map(([, title, id]) => ({ id, title: title.replace(/\\([!-/:-@[-`{-~])/g, '$1') }));

        const currentIndex = allQuestions.findIndex(item => item.id === q);
        const currentTitle = currentIndex !== -1 ? allQuestions[currentIndex].title : q;
        const category = categoryOf(categoryText, q);
        if (category) document.getElementById('doc-meta').innerText = `${area.name} · ${category}`;

        document.getElementById('question-title').innerText = currentTitle;
        document.title = `${currentTitle} - 매일메일`;

        document.getElementById('content').innerHTML = marked.parse(contentMd);
        Prism.highlightAll();
        addCopyButtons();

        // 본문을 그린 뒤에 학습 기록을 연다 (아래 학습 기록 스크립트가 기다린다)
        resolveQuestion({ id: q, title: currentTitle });

        if (currentIndex !== -1) {
          const paginationEl = document.getElementById('doc-pagination');
          paginationEl.style.display = 'grid';

          if (currentIndex > 0) {
            const prev = allQuestions[currentIndex - 1];
            const prevLink = document.getElementById('prev-link');
            prevLink.href = `?q=${prev.id}`;
            document.getElementById('prev-title').innerText = prev.title;
            prevLink.style.visibility = 'visible';
          }

          if (currentIndex < allQuestions.length - 1) {
            const next = allQuestions[currentIndex + 1];
            const nextLink = document.getElementById('next-link');
            nextLink.href = `?q=${next.id}`;
            document.getElementById('next-title').innerText = next.title;
            nextLink.style.visibility = 'visible';
          }
        }

      } catch (err) {
        document.getElementById('question-title').innerText = "질문을 불러올 수 없습니다";
        const box = document.createElement('div');
        box.className = 'doc-error';
        const title = document.createElement('p');
        title.className = 'doc-error-title';
        title.textContent = `오류: ${err.message}`;
        const hint = document.createElement('p');
        hint.className = 'doc-error-hint';
        hint.textContent = '질문 번호를 다시 확인해주세요.';
        box.append(title, hint);
        document.getElementById('content').replaceChildren(box);
      }
    }

    function addCopyButtons() {
      document.querySelectorAll('#content pre').forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = '복사';

        copyBtn.addEventListener('click', async () => {
          try {
            const code = pre.querySelector('code')?.innerText || pre.innerText;
            await navigator.clipboard.writeText(code);
            copyBtn.innerText = '복사됨';
            copyBtn.classList.add('copied');

            setTimeout(() => {
              copyBtn.innerText = '복사';
              copyBtn.classList.remove('copied');
            }, 1800);
          } catch (err) {
            copyBtn.innerText = '실패';
          }
        });

        wrapper.appendChild(copyBtn);
      });
    }

    document.getElementById('btn-share').addEventListener('click', async () => {
      try {
        // 메모로 바로 가는 주소(#memo)는 빼고 질문 주소만 복사한다
        await navigator.clipboard.writeText(location.href.split('#')[0]);
        showToast('질문 주소가 복사되었습니다.');
      } catch (e) {
        showToast('주소 복사에 실패했습니다.');
      }
    });

    initTheme();
    loadContent();
  </script>

  <!-- 학습 기록: 이해도·별표·메모. 저장·불러오기·GitHub 커밋은 질문 목록과 같은 코드(memo-core.js)를 쓰고,
       메모 보기·편집기는 memo-ui.js가 그린다. 로그인은 질문 목록에서 하고, 이 화면은 그 로그인 상태를 그대로 이어받는다. -->
  <script type="module">
    import {
      account, hooks, store, localBackend, createFirestoreBackend, watchOtherTabs,
      STALE_AFTER, SAVE_STATE_TEXT, saveErrorShown, flushInBackground, saveSoon,
      fb, firebaseConfigured, loadFirebase,
      isUncommitted, canCommitMemo, willCommitMemo, getGithubToken, memoCommitNote, saveMemo, normalizeMemo, MEMO_MAX,
      draftOf, saveDraft, deleteDraft, fetchLatest, moveOldDrafts,
    } from '../memo-core.js';
    import { createMemoView, createMemoEditor, createConflictView, MOD } from '../memo-ui.js';
    import { mergeMemo } from '../memo-merge.js';

    // 가져오기가 모두 성공해 이 모듈이 실행되기 시작했다는 표시 (../module-guard.js가 본다)
    window.maeilModuleReady = true;

    const LEVEL_LABELS = { new: '미학습', review: '복습 필요', done: '완벽 이해' };

    const els = {
      study: document.getElementById('study'),
      sync: document.getElementById('study-sync'),
      account: document.getElementById('memo-account'),
      saveState: document.getElementById('memo-save-state'),
      levelControl: document.getElementById('level-control'),
      levelOptions: [...document.querySelectorAll('#level-control .level-option')],
      memoBlock: document.getElementById('memo'),
      memoBody: document.getElementById('memo-body'),
      memoEdit: document.getElementById('memo-edit'),
      star: document.getElementById('star-toggle'),
      starLabel: document.getElementById('star-label'),
      docStatus: document.getElementById('doc-status'),
      statusLevel: document.getElementById('status-level'),
      statusMemo: document.getElementById('status-memo'),
      confirm: document.getElementById('confirm-dialog'),
    };

    let question = null; // { id, title }
    let ready = false; // 학습 기록을 처음 그렸는지
    let view = null; // 메모 보기 (createMemoView)
    let editor = null; // 메모 편집기 (createMemoEditor)
    let saving = false;
    // 편집 세션: 편집기에 연 글이 어디서 왔는지. 저장 직전에 다른 곳에서 바뀌었는지 비교하는 기준이다
    //   base: 이 초안을 시작할 때의 메모 (그사이 메모가 바뀌었는지 볼 때)
    //   draftAt: 열었을 때(또는 마지막으로 저장했을 때) 초안의 저장 시각. 초안이 없으면 0 (그사이 초안이 바뀌었는지 볼 때)
    //   saved: 마지막으로 저장해 둔 글 (초안이 있으면 초안, 없으면 메모). 편집기의 글이 이것과 다르면 저장하지 않은 변경이 있다
    let session = null;
    let conflict = null; // 겹친 곳 고르기 (createConflictView)
    let menu = null; // 편집기의 더보기 목록

    // ---------- 계정과 저장 상태 ----------

    function renderAccount(mode) {
      account.mode = mode;
      const user = account.user;
      const name = user ? user.displayName || user.email || 'GitHub 사용자' : '';
      els.account.textContent = {
        unconfigured: '이 브라우저에만 저장돼요',
        unavailable: 'Firebase를 불러오지 못해 이 브라우저에만 저장해요',
        guest: '이 브라우저에만 저장돼요',
        user: `${name} 계정에 저장돼요`,
        error: '계정 기록을 불러오지 못했어요 · 바꾼 내용은 연결되면 저장해요',
        denied: '이 계정은 기록 동기화가 허용되지 않았어요 · 이 기기에만 보관돼요',
      }[mode];
      els.sync.dataset.state = mode === 'user' ? 'synced' : ['error', 'unavailable', 'denied'].includes(mode) ? 'error' : 'local';
    }

    function renderSaveState(state) {
      els.saveState.dataset.state = state;
      els.saveState.textContent = SAVE_STATE_TEXT[state] || '';
    }

    hooks.toast = (message, tone, duration) => showToast(message, tone, duration);
    hooks.renderSaveState = renderSaveState;
    hooks.afterRetry = () => {
      if (account.mode === 'error') refreshIfStale(); // 쓰기가 됐으니 기록도 다시 불러와 본다
    };

    // 질문 목록의 initData·switchUser와 같은 순서로 기록을 불러온다 (이 브라우저 기록을 계정으로 옮기는 일은 질문 목록이 한다)
    async function initAccount() {
      if (!firebaseConfigured) {
        await store.use(localBackend);
        renderAccount('unconfigured');
        return;
      }
      try {
        await loadFirebase();
      } catch (err) {
        console.error(err);
        await store.use(localBackend);
        renderAccount('unavailable');
        return;
      }
      await new Promise((resolve) => {
        fb.auth.onAuthStateChanged(fb.authInstance, async (user) => {
          await switchUser(user);
          resolve();
        });
      });
    }

    // 다른 탭에서 로그인·로그아웃해도 불린다
    async function switchUser(user) {
      await store.flush().catch(() => {});
      store.backend.forget?.();
      account.user = user;

      if (!user) {
        await store.use(localBackend);
        renderAccount('guest');
      } else {
        const backend = createFirestoreBackend(user.uid);
        try {
          await store.use(backend);
          renderAccount('user');
        } catch (err) {
          console.error(err);
          store.useOffline(backend);
          // 규칙에서 거부됨(소유자 계정이 아님): 동기화하지 않고 이 기기에만 보관한다
          renderAccount(err?.code === 'permission-denied' ? 'denied' : 'error');
        }
        // 지난 접속에서 쓰지 못한 변경이 남아 있으면 보낸다
        if (store.busy && account.mode !== 'denied') flushInBackground();
      }

      // 계정이 바뀌면 그 계정의 기록을 보여준다 (고치던 메모가 있으면 그대로 둔다)
      if (ready) renderRecords();
    }

    // ---------- 이해도 · 별표 · 머리의 학습 상태 ----------

    const item = () => store.item(question.id);

    function renderLevel() {
      const level = store.level(question.id);
      for (const option of els.levelOptions) {
        const checked = option.dataset.level === level;
        option.setAttribute('aria-checked', String(checked));
        option.tabIndex = checked ? 0 : -1;
      }
    }

    function setLevel(level) {
      if (store.level(question.id) === level) return;
      store.update(question.id, { level: level === 'new' ? null : level });
      renderLevel();
      renderStatus();
      saveSoon();
    }

    function renderStar() {
      const starred = Boolean(item().starred);
      els.star.hidden = false;
      els.star.setAttribute('aria-pressed', String(starred));
      els.starLabel.textContent = starred ? '별표됨' : '별표';
      els.star.title = starred ? '별표 해제' : '별표해 두고 질문 목록에서 모아 보기';
    }

    function toggleStar() {
      const starred = !item().starred;
      store.update(question.id, { starred: starred ? true : null });
      renderStar();
      saveSoon();
      showToast(starred ? '별표했어요. 질문 목록에서 별표만 모아 볼 수 있어요.' : '별표를 해제했어요.');
    }

    // 제목 아래: 지금 이해도와 메모가 있는지. 누르면 학습 기록으로 내려간다.
    // 처음 여는 질문은 거의 다 미학습이라 그때는 아무것도 보이지 않는다 (질문 목록과 같다)
    function renderStatus() {
      const level = store.level(question.id);
      els.statusLevel.dataset.level = level;
      els.statusLevel.textContent = LEVEL_LABELS[level];
      els.statusLevel.hidden = level === 'new';
      els.statusMemo.hidden = !item().memo && !draftOf(question.id);
      els.docStatus.hidden = els.statusLevel.hidden && els.statusMemo.hidden;
    }

    // ---------- 메모 보기 ----------

    const dateFormat = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const shortDateFormat = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric' });

    // 최근이면 '3분 전'처럼, 오래됐으면 날짜로 보여준다
    function formatWhen(time) {
      const minutes = Math.floor((Date.now() - time) / 60000);
      if (minutes < 1) return '방금';
      if (minutes < 60) return `${minutes}분 전`;
      if (minutes < 24 * 60) return `${Math.floor(minutes / 60)}시간 전`;
      if (minutes < 7 * 24 * 60) return `${Math.floor(minutes / (24 * 60))}일 전`;
      return shortDateFormat.format(time);
    }

    function smallButton(label, action, primary = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `btn btn-sm${primary ? ' btn-primary' : ''}`;
      button.dataset.action = action;
      button.textContent = label;
      return button;
    }

    // 메모와 따로 저장해 둔 초안이 있다 (메모는 그대로다). 이어 쓰거나 지운다
    function draftNotice(draft) {
      const box = document.createElement('div');
      box.className = 'memo-draft';
      const text = document.createElement('p');
      text.className = 'memo-draft-text';
      text.style.margin = '0';
      const strong = document.createElement('strong');
      strong.textContent = '초안이 있어요';
      const when = document.createElement('time');
      when.dateTime = new Date(draft.at).toISOString();
      when.title = dateFormat.format(draft.at);
      when.textContent = `${formatWhen(draft.at)} 저장`;
      text.append(strong, ' · ', when);
      const buttons = document.createElement('div');
      buttons.className = 'memo-draft-buttons';
      buttons.append(smallButton('초안 삭제', 'draft-delete'), smallButton('이어 쓰기', 'draft-resume', true));
      box.append(text, buttons);
      return box;
    }

    // 메모가 없으면 빈 글쓰기 칸처럼 보이는 버튼 하나를 둔다. 누르면 같은 자리에 같은 테두리의 편집기가 열린다
    function emptyMemo() {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'memo-empty';
      button.dataset.action = 'memo-write';
      button.setAttribute('aria-label', '메모 쓰기');
      button.innerHTML = `
        <span class="memo-empty-text">핵심을 한 문장으로, 헷갈렸던 점과 나만의 예시까지 내 언어로 정리해 보세요</span>
        <span class="memo-empty-hint">마크다운으로 쓸 수 있어요</span>`;
      return button;
    }

    function memoFoot(memoAt) {
      const foot = document.createElement('div');
      foot.className = 'memo-foot';
      if (memoAt) {
        const when = document.createElement('time');
        when.dateTime = new Date(memoAt).toISOString();
        when.title = dateFormat.format(memoAt);
        when.textContent = `${formatWhen(memoAt)} 저장`;
        foot.append(when);
      }
      // 커밋에 실패했거나 예전 임시저장으로 저장해 아직 GitHub에 없는 메모 (실패는 저장할 때 알림으로 따로 알린다)
      if (isUncommitted(question.id)) {
        const warn = document.createElement('span');
        warn.className = 'memo-foot-warn';
        warn.textContent = '아직 GitHub에 올리지 않았어요';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'link-btn';
        retry.dataset.action = 'memo-recommit';
        retry.textContent = '올리기';
        foot.append(warn, retry);
      }
      return foot;
    }

    function renderMemo({ fresh = false } = {}) {
      view?.destroy();
      view = null;
      const memo = item().memo || '';
      const nodes = [];
      const draft = draftOf(question.id);
      if (draft) nodes.push(draftNotice(draft));
      if (memo) {
        view = createMemoView(memo, { id: question.id });
        if (fresh) view.el.classList.add('is-fresh');
        nodes.push(view.el, memoFoot(item().memoAt));
      } else if (!draft) {
        nodes.push(emptyMemo());
      }
      els.memoBody.replaceChildren(...nodes);
      // 초안이 있으면 초안 알림의 '이어 쓰기'로 연다 (같은 버튼을 두 번 두지 않는다)
      els.memoEdit.hidden = !memo || Boolean(draft);
    }

    // ---------- 메모 편집 ----------
    // 메모는 바로 고치지 않고 초안에서 고친다. 초안 저장(Ctrl+S, 더보기, 닫을 때 묻는 창)은 메모를 그대로 두고 초안만 저장하고,
    // 저장은 초안을 메모로 만들어 커밋한다. 초안은 계정에 두어 다른 기기에서도 이어 쓴다. 저절로 저장하지 않는다.

    const editorText = () => normalizeMemo(editor.getText());
    const hasUnsaved = () => Boolean(editor) && editorText() !== session.saved;

    // 편집기에 연 글: 초안이 있으면 그 초안, 없으면 메모
    function sessionFromRecords() {
      const memo = item().memo || '';
      const draft = draftOf(question.id);
      return draft ? { base: draft.base, draftAt: draft.at, saved: draft.text } : { base: memo, draftAt: 0, saved: memo };
    }

    // 지울 초안이 있는지: 이 기기의 기록에 있거나, 다른 곳에서 저장한 초안을 편집기에서 합쳤다 (그 초안은 이 기기의 기록에 없다)
    const hasDraft = () => Boolean(session?.draftAt || draftOf(question.id));

    // 메모와 초안은 MEMO_MAX자까지다 (firestore.rules도 같은 길이에서 초안을 거부한다).
    // 다른 곳의 글과 합쳐 길어진 글은 편집기의 글자 수 제한(maxLength)을 거치지 않으므로, 저장할 때 막고 줄이라고 알린다
    function blockTooLong(text) {
      if (text.length <= MEMO_MAX) return false;
      showToast(`${MEMO_MAX.toLocaleString()}자를 넘었어요(${text.length.toLocaleString()}자). 줄인 뒤 저장해 주세요.`, 'error', 5000);
      editor.focus({ keepSelection: true });
      return true;
    }

    // 합친 글을 편집기에 넣었다고 알릴 때 덧붙인다 (합쳐서 MEMO_MAX자를 넘었으면 줄여야 저장된다)
    const overLimitNote = (text) => (text.length > MEMO_MAX ? ` 합친 글이 ${MEMO_MAX.toLocaleString()}자를 넘어, 줄여야 저장할 수 있어요.` : '');

    // 편집기 아래: 지금 쓰는 글이 초안인지, 저장하지 않은 변경이 있는지
    function renderDraftState() {
      if (!editor) return;
      const unsaved = hasUnsaved();
      if (session.draftAt) editor.setDraftState(unsaved ? '초안 · 저장하지 않은 변경 있음' : `초안 · ${formatWhen(session.draftAt)} 저장`);
      else editor.setDraftState(unsaved ? '저장하지 않은 변경 있음' : '');
    }

    function openEditor() {
      if (editor) {
        editor.focus();
        return;
      }
      session = sessionFromRecords();
      view?.destroy();
      view = null;
      editor = createMemoEditor({
        text: session.saved,
        hasMemo: Boolean(item().memo),
        commitNote: memoCommitNote(question.id),
        ariaLabel: `${question.id.toUpperCase()} 메모`,
        onInput: renderDraftState,
        onSave: save,
        onSaveDraft: () => saveDraftNow(),
        onCancel: requestClose,
        onMore: toggleMenu,
      });
      els.memoBody.replaceChildren(editor.el);
      els.memoEdit.hidden = true;
      editor.mount();
      editor.focus();
      editor.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      renderDraftState();
    }

    // 편집기를 닫으면 포커스를 편집기를 열었던 자리(편집 버튼, 메모가 없으면 메모 쓰기 칸)로 돌린다.
    // 그러지 않으면 편집기와 함께 포커스가 사라져, 키보드로 쓰는 사람은 페이지 처음부터 다시 찾아와야 한다
    function closeEditor({ fresh = false } = {}) {
      closeMenu();
      conflict?.el.remove();
      conflict = null;
      editor?.destroy();
      editor = null;
      session = null;
      renderMemo({ fresh });
      renderStatus();
      (els.memoEdit.hidden ? els.memoBody.querySelector('.memo-empty') : els.memoEdit)?.focus({ preventScroll: true });
    }

    // 저장 직전에 이 초안과 메모를 새로 읽어, 편집기를 연 뒤 다른 곳(다른 기기·탭)에서 바뀌었는지 본다.
    // 바뀌었으면 그쪽 변경과 합쳐 편집기에 넣고 false를 돌려준다 (저장하지 않는다. 합친 글을 확인하고 다시 저장한다).
    // 겹친 곳이 있으면 고르는 화면을 연다. 그대로면 true. 읽지 못하면(연결 끊김) 확인 없이 true (변경은 이 기기에 보관했다가 보낸다)
    // publish: 메모로 저장하려는지 (초안만 저장할 때는 메모가 바뀌었어도 상관없다. 초안은 메모를 덮지 않는다)
    async function catchUp(text, { publish }) {
      const latest = await fetchLatest(question.id);
      if (!editor) return false;
      if (!latest) return true;
      const theirs = latest.draft;
      if ((theirs?.at || 0) !== session.draftAt) {
        // 다른 곳에서 이 초안을 저장했다
        if (theirs) return mergeIn(session.saved, text, theirs.text, '다른 곳에서 저장한 초안', { base: theirs.base, draftAt: theirs.at, saved: theirs.text });
        // 다른 곳에서 이 초안을 메모로 저장했다 (초안은 메모가 되며 지워진다)
        if (latest.memo !== session.base) return mergeIn(session.saved, text, latest.memo, '다른 곳에서 저장한 메모', { base: latest.memo, draftAt: 0, saved: latest.memo });
        // 다른 곳에서 이 초안을 지웠다 (메모는 그대로다)
        const again = await confirmDialog({
          title: '다른 곳에서 이 초안을 지웠어요',
          body: '지금 쓴 글로 다시 저장할까요? 저장한 메모는 그대로예요.',
          yes: '다시 저장',
          no: '계속 쓰기',
          tone: 'primary',
        });
        if (!again || !editor) {
          editor?.focus({ keepSelection: true });
          return false;
        }
        session = { ...session, draftAt: 0, saved: item().memo || '' };
        return true;
      }
      if (publish && latest.memo !== session.base) {
        return mergeIn(session.base, text, latest.memo, '다른 곳에서 저장한 메모', { ...session, base: latest.memo });
      }
      return true;
    }

    // 세 갈래로 합친다 (memo-merge.js). next: 합친 뒤의 세션 (다른 쪽 글이 새 기준이 된다)
    function mergeIn(base, mine, theirs, theirsLabel, next) {
      const result = mergeMemo(base, mine, theirs);
      const previous = session;
      session = next;
      if (result.clean) {
        if (result.text === mine) return true; // 다른 쪽 변경이 이미 들어 있다. 그대로 저장한다
        editor.setText(result.text);
        renderDraftState();
        editor.focus({ keepSelection: true });
        showToast(`다른 곳에서 고친 내용을 합쳤어요. 확인한 뒤 다시 저장해 주세요.${overLimitNote(result.text)}`, 'info', 5000);
        return false;
      }
      showConflict(result.parts, theirsLabel, previous);
      return false;
    }

    // 겹친 곳 고르기: 편집기를 잠깐 숨기고 그 자리에 연다. 취소하면 합치기 전의 세션으로 돌아간다
    // (그대로 다시 저장하면 다시 겹친 것을 알려준다)
    function showConflict(parts, theirsLabel, previous) {
      const hide = () => {
        conflict?.el.remove();
        conflict = null;
        if (editor) editor.el.hidden = false;
      };
      conflict = createConflictView({
        parts,
        theirsLabel,
        onDone(text) {
          hide();
          editor.setText(text);
          renderDraftState();
          editor.focus();
          showToast(`고른 글을 합쳐 편집기에 넣었어요. 다듬은 뒤 다시 저장해 주세요.${overLimitNote(text)}`, 'info', 5000);
        },
        onCancel() {
          hide();
          session = previous;
          renderDraftState();
          editor?.focus({ keepSelection: true });
        },
      });
      closeMenu();
      editor.el.hidden = true;
      els.memoBody.prepend(conflict.el);
      conflict.focus();
    }

    // 초안 저장 (Ctrl+S, 더보기, 닫을 때 묻는 창): 메모는 그대로 두고 초안만 계정에 저장한다. 편집기는 열어 둔다.
    // 습관처럼 자주 누르는 키라서 쓰는 중에 막지 않는다 (작성 칸을 잠그지 않는다). 그사이 더 쓴 글은 저장하지 않은 변경으로 남는다.
    // 저장했거나 저장할 것이 없으면 true
    let draftSaving = null;

    function saveDraftNow() {
      draftSaving ??= (async () => {
        if (!editor || saving || conflict) return false;
        const text = editorText();
        if (!text) {
          editor.setDraftState('빈 글은 초안으로 저장하지 않아요');
          return false;
        }
        if (text === session.saved) {
          editor.setDraftState(session.draftAt ? '초안 · 바뀐 내용 없음' : '바뀐 내용 없음');
          return true;
        }
        if (blockTooLong(text)) return false;
        editor.setDraftState('초안 저장 중…');
        if (!(await catchUp(text, { publish: false }))) return false;
        const result = await saveDraft(question.id, text, session.base);
        if (!result.draft) {
          // 글은 위에서 확인했으니, 기준이 된 저장된 메모가 MEMO_MAX자를 넘는다 (이 제한이 생기기 전에 저장한 긴 메모).
          // 메모로 저장하면 기준이 지금 글로 바뀌어 다시 초안을 저장할 수 있다
          renderDraftState();
          showToast(`저장된 메모가 ${MEMO_MAX.toLocaleString()}자를 넘어 초안으로 저장할 수 없어요. 메모로 저장해 주세요.`, 'error', 5000);
          return false;
        }
        if (!editor) return result.saved;
        session = { ...session, draftAt: result.draft.at, saved: result.draft.text };
        editor.setDraftState(result.saved ? '초안을 저장했어요' : '초안 · 이 기기에 보관했어요 · 연결되면 올려요');
        renderStatus();
        return true;
      })().finally(() => {
        draftSaving = null;
      });
      return draftSaving;
    }

    // 저장: 초안을 메모로 만들고 GitHub에 커밋한다 (초안은 지워진다).
    // shortcut: Ctrl+Enter로 저장했는지 (저장 버튼이면 false)
    async function save({ shortcut = false } = {}) {
      if (draftSaving) await draftSaving; // 방금 누른 Ctrl+S가 끝난 뒤에 저장한다
      if (!editor || saving || conflict) return;
      closeMenu();
      const text = editorText();
      const memo = item().memo || '';
      const draft = hasDraft();
      if (!text) {
        // 비우고 저장하면 지우는 것이므로 지울지 묻는다
        if (memo) removeMemo();
        else if (draft) removeDraft();
        else closeEditor();
        return;
      }
      // 바뀐 것도, 지울 초안도 없으면 닫는다. 아직 올리지 않은 메모면 저장 버튼으로 커밋한다
      if (text === memo && !draft && !isUncommitted(question.id)) {
        closeEditor();
        return;
      }
      if (blockTooLong(text)) return;
      // Ctrl+Enter는 쓰다가 잘못 누르기 쉬우므로(Ctrl+S를 누른 손을 떼기 전에 Enter로 줄을 바꾸는 등) GitHub에 커밋할 때는 한 번 더 묻는다.
      // 커밋은 저장소 기록에 남아 되돌리기 어렵지만, 초안 저장은 메모를 바꾸지 않으므로 묻지 않는다. 저장 버튼은 일부러 누르는 것이라 묻지 않는다
      if (shortcut && canCommitMemo() && !(await confirmCommit())) return;
      saving = true;
      editor.setBusy(true);
      // GitHub 토큰이 없으면 연결 팝업을 열어야 하는데, 브라우저는 누른 직후에만 팝업을 허락한다 (Safari는 1초 안팎).
      // 그래서 다른 곳의 변경을 새로 읽기(네트워크) 전에 토큰부터 구해 둔다. 토큰이 있으면 팝업 없이 바로 끝난다.
      // 겹친 곳이 있어 이번에 저장하지 않게 되어도 연결은 그대로 남아 다음 저장에 쓰인다
      const githubToken = willCommitMemo(question.id, text) ? getGithubToken() : null;
      githubToken?.catch(() => {}); // 실패는 saveMemo가 알린다. 저장하지 않고 끝나도 처리하지 않은 거부로 남지 않게 한다
      const ok = await catchUp(text, { publish: true });
      if (!ok || !editor) {
        saving = false;
        editor?.setBusy(false);
        return;
      }
      // 초안을 메모로 저장했으니 초안은 지운다 (다른 곳의 초안을 합쳤다면 그 초안도)
      await saveMemo(question.id, editorText(), { title: question.title, dropDraft: hasDraft(), githubToken });
      saving = false;
      closeEditor({ fresh: true });
    }

    async function confirmCommit() {
      const yes = await confirmDialog({
        title: 'GitHub에 커밋할까요?',
        body: `${store.memoRepo.fullName}의 ${question.id}.md로 커밋하고 편집기를 닫아요. 메모는 그대로 두고 초안으로만 저장하려면 ${MOD}+S를 누르세요.`,
        yes: '커밋',
        no: '계속 쓰기',
        tone: 'primary',
      });
      if (!yes) {
        editor?.focus({ keepSelection: true });
        return false;
      }
      return Boolean(editor);
    }

    // 닫기 (닫기 버튼, Esc): 저장하지 않은 변경이 있으면 초안으로 저장할지, 버릴지 묻는다 (브라우저의 페이지 이탈 경고와 같다)
    async function requestClose() {
      if (!editor || saving || conflict) return;
      closeMenu();
      if (!hasUnsaved()) {
        closeEditor();
        return;
      }
      if (!editorText()) {
        const discard = await confirmDialog({ title: '쓰던 내용을 버릴까요?', body: '저장하지 않은 변경은 사라져요.', yes: '버리기', no: '계속 쓰기' });
        if (discard) closeEditor();
        else editor?.focus({ keepSelection: true });
        return;
      }
      const answer = await confirmDialog({
        title: '저장하지 않은 변경이 있어요',
        body: '초안으로 저장하면 메모는 그대로 두고, 다음에 이 기기나 다른 기기에서 이어 쓸 수 있어요.',
        yes: '초안 저장하고 닫기',
        no: '계속 쓰기',
        alt: '변경 버리기',
        tone: 'primary',
      });
      if (answer === 'alt') closeEditor();
      else if (answer === 'yes' && (await saveDraftNow())) closeEditor();
      else editor?.focus({ keepSelection: true });
    }

    // 초안 지우기 (더보기, 질문 화면의 '초안 삭제'): 메모는 그대로다
    async function removeDraft() {
      if (saving) return;
      closeMenu();
      const yes = await confirmDialog({
        title: '초안을 삭제할까요?',
        body: '이 초안이 지워져요. 저장한 메모는 그대로예요.',
        yes: '삭제',
        no: '취소',
      });
      if (!yes) {
        editor?.focus({ keepSelection: true });
        return;
      }
      saving = true;
      editor?.setBusy(true);
      await deleteDraft(question.id);
      saving = false;
      if (editor) closeEditor();
      else renderMemo();
      renderStatus();
      showToast('초안을 삭제했어요.');
    }

    // 메모 지우기 (더보기, 작성 칸을 비운 채 저장): 초안도 함께 지운다.
    // GitHub에 커밋하는 계정이면 저장소의 {id}.md 파일도 지운다. 지난 커밋은 저장소 기록에 남는다
    async function removeMemo() {
      if (!editor || saving) return;
      closeMenu();
      const draftToo = hasDraft() ? ' 초안도 함께 지워져요.' : '';
      const yes = await confirmDialog({
        title: '메모를 삭제할까요?',
        body: canCommitMemo()
          ? `이 질문의 메모가 지워지고, ${store.memoRepo.fullName}의 ${question.id}.md 파일도 삭제돼요. 지난 커밋 기록은 GitHub에 남아요.${draftToo}`
          : `이 질문의 메모가 지워지고 되돌릴 수 없어요.${draftToo}`,
        yes: '삭제',
        no: '취소',
      });
      if (!yes) {
        editor?.focus({ keepSelection: true });
        return;
      }
      saving = true;
      editor?.setBusy(true);
      await saveMemo(question.id, '', { title: question.title, dropDraft: hasDraft() });
      saving = false;
      closeEditor();
    }

    // GitHub 커밋만 실패했던 메모를 다시 올린다. 메모만 올리고, 쓰던 초안은 그대로 둔다 (saveMemo에 dropDraft를 주지 않는다)
    function recommit() {
      const memo = item().memo || '';
      if (!memo) return;
      saveMemo(question.id, memo, { title: question.title }).then(() => {
        if (!editor) renderMemo();
      });
    }

    // ---------- 편집기의 더보기 ----------
    // 가끔 쓰는 것: 초안 저장(Ctrl+S가 없는 터치 기기), 초안 삭제, 메모 삭제. 편집기 아래 버튼 위로 펼친다

    function toggleMenu(button) {
      if (menu) {
        closeMenu();
        return;
      }
      const text = editorText();
      const items = [
        { label: '초안 저장', hint: `메모는 그대로 두고 저장해요 · ${MOD}+S`, enabled: Boolean(text) && hasUnsaved(), run: saveDraftNow },
        { label: '초안 삭제', hint: '저장한 메모는 그대로예요', enabled: hasDraft(), run: removeDraft, danger: true },
        {
          label: '메모 삭제',
          hint: canCommitMemo() ? 'GitHub의 파일과 초안도 함께 지워져요' : '초안도 함께 지워져요',
          enabled: Boolean(item().memo),
          run: removeMemo,
          danger: true,
        },
      ];
      const list = document.createElement('div');
      list.className = 'memo-more';
      list.setAttribute('role', 'menu');
      list.setAttribute('aria-label', '더보기');
      for (const entry of items) {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = `memo-more-item${entry.danger ? ' is-danger' : ''}`;
        option.setAttribute('role', 'menuitem');
        option.disabled = !entry.enabled;
        const label = document.createElement('span');
        label.className = 'memo-more-label';
        label.textContent = entry.label;
        const hint = document.createElement('span');
        hint.className = 'memo-more-hint';
        hint.textContent = entry.hint;
        option.append(label, hint);
        option.addEventListener('click', () => {
          closeMenu({ focus: false });
          entry.run();
        });
        list.append(option);
      }
      // 목록 안에서는 위아래 화살표로 옮기고, Esc·Tab이면 닫는다 (Esc가 편집기 닫기로 넘어가지 않게 막는다)
      list.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Tab') {
          e.preventDefault();
          e.stopPropagation();
          closeMenu();
          return;
        }
        const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
        if (!step) return;
        e.preventDefault();
        const options = [...list.querySelectorAll('.memo-more-item:not(:disabled)')];
        const index = options.indexOf(document.activeElement);
        options[(index + step + options.length) % options.length]?.focus();
      });
      button.parentElement.append(list);
      button.setAttribute('aria-expanded', 'true');
      menu = { list, button };
      list.querySelector('.memo-more-item:not(:disabled)')?.focus();
      setTimeout(() => document.addEventListener('pointerdown', onOutside, true));
    }

    function onOutside(e) {
      if (menu && !menu.list.contains(e.target) && !menu.button.contains(e.target)) closeMenu({ focus: false });
    }

    function closeMenu({ focus = true } = {}) {
      if (!menu) return;
      document.removeEventListener('pointerdown', onOutside, true);
      menu.list.remove();
      menu.button.setAttribute('aria-expanded', 'false');
      if (focus) menu.button.focus();
      menu = null;
    }

    // ---------- 확인 창 ----------

    // 확인 창의 버튼 사이를 화살표로도 오간다 (운영체제의 확인 창처럼). 왼쪽·위는 앞 버튼, 오른쪽·아래는 다음 버튼
    function bindDialogArrowKeys(dialog) {
      dialog.addEventListener('keydown', (e) => {
        const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
        if (!step || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        const buttons = [...dialog.querySelectorAll('.confirm-buttons button:not([hidden])')];
        const index = buttons.indexOf(document.activeElement);
        if (index === -1) return;
        e.preventDefault();
        buttons[(index + step + buttons.length) % buttons.length].focus();
      });
    }

    bindDialogArrowKeys(els.confirm);

    // tone: '예' 버튼 색. 지우거나 버리는 일은 빨강(danger), 저장처럼 해가 없는 일은 초록(primary)
    // alt를 주면 왼쪽에 버튼이 하나 더 생기고(빨간 글씨, 예: 변경 버리기), 'yes' | 'no' | 'alt'로 답한다. 없으면 true | false
    function confirmDialog({ title, body, yes, no, alt = '', tone = 'danger' }) {
      const dialog = els.confirm;
      dialog.querySelector('#confirm-title').textContent = title;
      dialog.querySelector('#confirm-body').textContent = body;
      const yesButton = dialog.querySelector('[data-answer="yes"]');
      yesButton.textContent = yes;
      yesButton.className = `btn btn-${tone}`;
      dialog.querySelector('[data-answer="no"]').textContent = no;
      const altButton = dialog.querySelector('[data-answer="alt"]');
      altButton.textContent = alt;
      altButton.hidden = !alt;
      return new Promise((resolve) => {
        const finish = (answer) => {
          dialog.removeEventListener('click', onClick);
          dialog.removeEventListener('cancel', onCancel);
          dialog.close();
          resolve(alt ? answer : answer === 'yes');
        };
        const onClick = (e) => {
          const answer = e.target.closest('[data-answer]')?.dataset.answer;
          if (answer) {
            finish(answer);
            return;
          }
          // 창 바깥(배경)을 누르면 닫는다
          const rect = dialog.getBoundingClientRect();
          const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
          if (!inside) finish('no');
        };
        const onCancel = (e) => {
          e.preventDefault();
          finish('no');
        };
        dialog.addEventListener('click', onClick);
        dialog.addEventListener('cancel', onCancel);
        dialog.showModal();
      });
    }

    // ---------- 전체 그리기 · 다시 불러오기 ----------

    // 기록을 다시 그린다. 고치던 메모가 있으면 편집기는 그대로 둔다
    function renderRecords() {
      renderLevel();
      renderStar();
      renderStatus();
      if (!editor) renderMemo();
      else if (!hasUnsaved() && !conflict) {
        // 고치지 않은 편집기는 새로 읽은 초안(없으면 메모)으로 바꾸고, 이것을 기준으로 삼는다
        session = sessionFromRecords();
        editor.setText(session.saved);
        renderDraftState();
      }
    }

    // 다시 불러온 기록으로 화면을 고친다. 고치던 메모가 있거나 쓰는 중이면 다음 기회로 미룬다.
    // fresh가 아니면 탭 단위 캐시가 있을 때 그것을 읽는다 (질문 목록에서 저장한 기록도 캐시에 들어 있다)
    async function reloadRecords({ fresh = true } = {}) {
      if (!ready || account.mode === 'denied' || !store.canReload || hasUnsaved()) return;
      try {
        await store.refresh({ fresh });
      } catch (err) {
        console.error(err);
        return;
      }
      // 캐시를 읽은 것만으로는 Firestore에 다시 닿았는지 알 수 없다
      if (account.mode === 'error' && fresh) {
        renderAccount('user');
        if (store.busy) flushInBackground();
      }
      renderRecords();
    }

    // 다른 기기나 다른 탭에서 바꾼 내용을 보도록, 오래 자리를 비웠거나 다른 탭이 기록을 썼으면 돌아올 때 다시 읽는다
    async function refreshIfStale() {
      if (Date.now() - store.loadedAt < STALE_AFTER) return;
      await reloadRecords();
    }

    function bindEvents() {
      els.levelControl.addEventListener('click', (e) => {
        const option = e.target.closest('.level-option');
        if (option) setLevel(option.dataset.level);
      });

      // 라디오 묶음처럼 화살표로 옮기며 고른다
      els.levelControl.addEventListener('keydown', (e) => {
        const index = els.levelOptions.indexOf(document.activeElement);
        if (index === -1) return;
        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (!step) return;
        e.preventDefault();
        const next = els.levelOptions[(index + step + els.levelOptions.length) % els.levelOptions.length];
        setLevel(next.dataset.level);
        next.focus();
      });

      els.star.addEventListener('click', toggleStar);
      els.memoEdit.addEventListener('click', openEditor);

      els.memoBody.addEventListener('click', (e) => {
        const action = e.target.closest('[data-action]')?.dataset.action;
        if (action === 'memo-write' || action === 'draft-resume') openEditor();
        else if (action === 'memo-recommit') recommit();
        else if (action === 'draft-delete') removeDraft();
      });

      // 제목 아래 상태를 누르면 부드럽게 내려간다 (주소에 #memo 등을 남겨 새로고침해도 그 자리로 온다)
      els.docStatus.addEventListener('click', (e) => {
        const link = e.target.closest('a[href^="#"]');
        if (!link) return;
        e.preventDefault();
        history.replaceState(null, '', link.hash);
        document.querySelector(link.hash)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      // 질문을 옮기기 전에 아직 쓰지 않은 변경을 먼저 저장한다 (저장이 실패하는 중이면 기다리지 않는다. 변경은 이 기기에 보관돼 있다)
      document.addEventListener('click', async (e) => {
        const link = e.target.closest('a.q-link');
        if (!link || !store.busy || saveErrorShown || account.mode === 'denied' || hasUnsaved()) return;
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        await Promise.race([
          store.flush().catch(() => {}),
          new Promise((resolve) => setTimeout(resolve, 2000)),
        ]);
        location.href = link.href;
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && store.busy && !saveErrorShown && account.mode !== 'denied') flushInBackground();
        else if (document.visibilityState === 'visible') refreshIfStale();
      });

      // 다른 탭(질문 목록 등)이 기록을 쓰면 낡았다고 표시해 두고, 이 탭이 보일 때 다시 읽는다
      watchOtherTabs(() => {
        if (document.visibilityState === 'visible') refreshIfStale();
      });

      // 뒤로가기·앞으로가기로 돌아오면(bfcache) 떠날 때 상태 그대로 보이므로, 그사이 다른 화면에서 저장한 기록을 반영한다
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) reloadRecords({ fresh: false });
      });

      // 쓰지 못한 변경은 이 기기에 보관되므로, 붙잡는 건 초안으로도 저장하지 않은 변경과
      // 저장 공간이 부족해 이 기기에도 보관하지 못한 변경뿐이다
      window.addEventListener('beforeunload', (e) => {
        if (hasUnsaved() || (store.busy && !store.pendingKept)) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    }

    // 질문 목록의 메모 한 줄(#memo)이나 제목 아래 상태(#study)로 들어왔으면 그 자리로 내려간다
    function scrollToHash() {
      const target = { '#memo': els.memoBlock, '#study': els.study }[location.hash];
      if (!target) return;
      if (location.hash === '#memo') view?.expand(); // 메모를 보러 왔으니 다 펼쳐 둔다
      requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
    }

    // 본문과 기록을 함께 불러온다. 본문을 못 불러오면(없는 질문) 학습 기록을 열지 않는다
    async function main() {
      const accountReady = initAccount();
      question = await window.questionReady;
      els.study.hidden = false;
      try {
        await accountReady;
      } catch (err) {
        console.error(err);
        els.memoBody.querySelector('.memo-loading').textContent = '기록을 불러오지 못했어요. 잠시 후 새로고침해주세요.';
        return;
      }
      ready = true;
      // 예전에 이 브라우저에 저절로 보관하던 쓰던 메모가 남아 있으면 초안으로 옮긴다
      const moved = moveOldDrafts();
      if (moved) showToast(`이 브라우저에 남아 있던 쓰던 메모 ${moved}개를 초안으로 옮겼어요.`, 'info', 4000);
      renderRecords();
      bindEvents();
      await view?.ready;
      scrollToHash();
    }

    main();
  </script>
</body>
</html>
