<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매일메일</title>

  <script>
    // 기존 메일 링크(/?q=fe-1)는 질문 뷰어로 보낸다
    if (new URLSearchParams(location.search).has('q')) {
      location.replace('questions/' + location.search);
    }

    // 렌더링 전에 테마를 적용해 깜빡임을 막는다
    (function () {
      let saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --bg-subtle: #f2f4f6;
      --border-color: #e5e8eb;
      --text-main: #191f28;
      --text-sub: #333d4b;
      --text-muted: #8b95a1;
      --primary: #00a86b;
      --primary-light: #e8f5e9;
      --review: #b45309;
      --review-bar: #f59e0b;
      --review-light: #fff4e5;
      --danger: #e5484d;
      --skeleton-base: #f0f2f5;
      --skeleton-highlight: #e4e7eb;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    /* 다크 테마 팔레트 */
    [data-theme="dark"] {
      --bg-body: #111315;
      --bg-card: #181a1d;
      --bg-subtle: #202327;
      --border-color: #2c3138;
      --text-main: #f0f3f6;
      --text-sub: #c5cbd3;
      --text-muted: #767f8d;
      --primary: #00c47d;
      --primary-light: rgba(0, 196, 125, 0.16);
      --review: #fbbf24;
      --review-bar: #f5a524;
      --review-light: rgba(251, 191, 36, 0.14);
      --danger: #ff6369;
      --skeleton-base: #24272c;
      --skeleton-highlight: #30353c;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.6;
      letter-spacing: -0.02em;
      color: var(--text-sub);
      background-color: var(--bg-body);
      margin: 0;
      padding: 40px 20px 80px;
      transition: background-color 0.2s;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    [hidden] { display: none !important; }

    /* 헤더 */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-user {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .account-user img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-subtle);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-sub);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary);
      color: #ffffff;
      filter: brightness(1.05);
    }

    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 13px;
    }

    .icon-btn {
      width: 36px;
      padding: 0;
    }

    .sun-icon { display: none; }
    .moon-icon { display: block; }
    [data-theme="dark"] .sun-icon { display: block; }
    [data-theme="dark"] .moon-icon { display: none; }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-muted);
    }

    .sync-status[data-state="synced"] .sync-dot { background: var(--primary); }
    .sync-status[data-state="error"] .sync-dot { background: var(--danger); }

    /* 메모 저장소 */
    .repo-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    .repo-card-icon {
      display: flex;
      flex-shrink: 0;
      color: var(--text-main);
    }

    .repo-card-icon svg {
      width: 22px;
      height: 22px;
    }

    .repo-card-body {
      flex: 1;
      min-width: 0;
    }

    .repo-card-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .repo-card-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-card-value.is-empty {
      font-weight: 500;
      color: var(--text-muted);
    }

    .repo-card-value a {
      color: inherit;
      text-decoration: none;
    }

    .repo-card-value a:hover { color: var(--primary); }

    .repo-dialog {
      width: min(520px, calc(100% - 32px));
      max-height: min(640px, calc(100% - 64px));
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--bg-card);
      color: var(--text-sub);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
    }

    .repo-dialog[open] {
      display: flex;
      flex-direction: column;
    }

    .repo-dialog::backdrop { background: rgba(0, 0, 0, 0.45); }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 20px 20px 12px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .dialog-head p {
      margin: 4px 0 0;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .dialog-search {
      flex: none;
      margin: 0 20px 8px;
    }

    .repo-body {
      flex: 1;
      min-height: 180px;
      overflow-y: auto;
      padding: 4px 12px 8px;
    }

    .repo-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .repo-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 2px 12px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .repo-item:hover { background: var(--bg-subtle); }
    .repo-item[aria-pressed="true"] { background: var(--primary-light); }

    .repo-name,
    .repo-desc {
      grid-column: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .repo-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .repo-check {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
    }

    .repo-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 40px 12px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .dialog-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border-color);
      font-size: 13.5px;
    }

    .dialog-links {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
    }

    .dialog-foot a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .dialog-foot a:hover { text-decoration: underline; }

    /* 오늘 받은 질문 */
    .today {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      margin-bottom: 12px;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .today:hover { border-color: var(--primary); }

    .today-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    .today-title {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .today-go {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 학습 현황 */
    .stats-card {
      padding: 16px;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--bg-subtle);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .stat:hover { border-color: var(--border-color); }

    .stat[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stat-count {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--border-color);
    }

    .dot-review { background: var(--review-bar); }
    .dot-done { background: var(--primary); }

    .progress {
      display: flex;
      height: 6px;
      margin-top: 14px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--bg-subtle);
    }

    .progress span { transition: width 0.3s; }
    .progress-done { background: var(--primary); }
    .progress-review { background: var(--review-bar); }

    .progress-text {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 검색 & 필터 */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search {
      position: relative;
      flex: 1;
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search input,
    .toolbar select {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font: inherit;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .search input {
      padding: 0 44px 0 42px;
    }

    .search input::placeholder { color: var(--text-muted); }

    .search input:focus,
    .toolbar select:focus,
    .memo-editor textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .search-kbd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 22px;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-family: inherit;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      pointer-events: none;
    }

    .search input:focus + .search-kbd,
    .search input:not(:placeholder-shown) + .search-kbd { display: none; }

    .toolbar select {
      width: auto;
      max-width: 240px;
      padding: 0 12px;
      cursor: pointer;
    }

    .list-head {
      margin: 0 4px 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 질문 목록 */
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .q-row {
      padding: 16px 20px;
    }

    /* 필터로 숨긴 행이 있어도 보이는 행 사이에만 구분선을 긋는다 */
    .q-row:not([hidden]) ~ .q-row { border-top: 1px solid var(--border-color); }

    .q-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px 16px;
    }

    .q-num {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .q-row[data-state="review"] .q-num .dot { background: var(--review-bar); }
    .q-row[data-state="done"] .q-num .dot { background: var(--primary); }

    .q-title {
      display: block;
      margin-top: 2px;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .q-title:hover { color: var(--primary); }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .q-cat { flex-shrink: 0; }

    .q-memo-preview {
      min-width: 0;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .q-memo-preview::before {
      content: "·";
      margin-right: 8px;
      color: var(--text-muted);
    }

    .q-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .level-seg {
      display: inline-flex;
      padding: 3px;
      border-radius: 10px;
      background: var(--bg-subtle);
    }

    .level-seg button {
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }

    .level-seg button:hover { color: var(--text-main); }

    .level-seg button[data-level="new"][aria-pressed="true"] {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .level-seg button[data-level="review"][aria-pressed="true"] {
      background: var(--review-light);
      color: var(--review);
    }

    .level-seg button[data-level="done"][aria-pressed="true"] {
      background: var(--primary-light);
      color: var(--primary);
    }

    .memo-btn.has-memo {
      border-color: var(--primary);
      color: var(--primary);
    }

    .memo-btn[aria-expanded="true"] {
      background: var(--bg-subtle);
    }

    /* 메모 편집기 */
    .memo-editor {
      margin-top: 14px;
    }

    .memo-editor textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      font: inherit;
      font-size: 15px;
      line-height: 1.65;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .memo-editor textarea::placeholder { color: var(--text-muted); }

    .memo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .memo-info {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    .memo-count { font-variant-numeric: tabular-nums; }
    .memo-github.is-error { color: var(--danger); }

    .memo-buttons {
      display: flex;
      gap: 6px;
    }

    .empty {
      margin: 0;
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* 스켈레톤 UI */
    .skeleton {
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
      border-radius: 6px;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-line {
      height: 14px;
      margin: 6px 0;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--text-main);
      color: var(--bg-card);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast[data-tone="error"] {
      background: var(--danger);
      color: #ffffff;
    }

    @media (hover: none) {
      .search-kbd { display: none; }
    }

    @media (max-width: 640px) {
      body { padding: 24px 16px 64px; }

      .brand h1 { font-size: 22px; }
      .brand p { font-size: 13px; }

      .account-name { display: none; }

      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat-count { font-size: 20px; }

      .toolbar { flex-direction: column; }
      .toolbar select { width: 100%; max-width: none; }

      .q-row { padding: 16px; }
      .q-main { grid-template-columns: minmax(0, 1fr); }
      .q-actions { justify-content: space-between; }

      .today { padding: 16px 18px; }
      .today-title { font-size: 16px; }
      .today-go { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="brand">
        <h1>매일메일</h1>
        <p>면접 질문을 학습하고, 내 언어로 정리해요</p>
      </div>
      <div class="header-actions">
        <div id="account" class="account"></div>
        <button id="theme-toggle" class="btn icon-btn" aria-label="테마 전환" type="button">
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>

  <script type="module">
    import { firebaseConfig } from './firebase-config.js';

    const FIREBASE_VERSION = '10.14.1';
    const MEMO_MAX = 1000;
    const LEVEL_SAVE_DELAY = 1200; // 학습 수준 변경을 모아 한 번에 쓴다
    const RETRY_DELAY = 5000;
    const CACHE_TTL = 10 * 60 * 1000; // 새로고침·뒤로가기 때 Firestore를 다시 읽지 않도록 세션 캐시
    const LOCAL_KEY = 'maeil-study-v1';
    // 메모 저장소 권한은 GitHub App 설치로 받는다 (설치한 저장소에만 Contents 읽기/쓰기)
    const GITHUB_APP_INSTALL_URL = 'https://github.com/apps/maeil-mail-reborn-memo/installations/new';
    const MEMO_BRANCH = 'main';
    const GITHUB_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>';

    const els = {
      account: document.getElementById('account'),
      syncStatus: document.getElementById('sync-status'),
      syncText: document.getElementById('sync-text'),
      repoCard: document.getElementById('repo-card'),
      repoCardValue: document.getElementById('repo-card-value'),
      repoOpen: document.getElementById('repo-open'),
      repoDialog: document.getElementById('repo-dialog'),
      repoSearch: document.getElementById('repo-search'),
      repoBody: document.getElementById('repo-body'),
      today: document.getElementById('today'),
      todayNum: document.getElementById('today-num'),
      todayTitle: document.getElementById('today-title'),
      stats: document.getElementById('stats'),
      progressDone: document.getElementById('progress-done'),
      progressReview: document.getElementById('progress-review'),
      progressText: document.getElementById('progress-text'),
      search: document.getElementById('search'),
      category: document.getElementById('category'),
      resultCount: document.getElementById('result-count'),
      list: document.getElementById('list'),
      toast: document.getElementById('toast'),
      rowTemplate: document.getElementById('row-template'),
      editorTemplate: document.getElementById('editor-template'),
    };

    let data = { questions: [], categories: [], today: null };
    let fb = null;
    let currentUser = null;
    let accountMode = 'unconfigured';
    let repoCache = null;
    const rows = new Map();
    const uncommitted = new Set(); // Firestore에는 저장했지만 GitHub 커밋에 실패한 메모
    const filter = { level: 'all', category: '', text: '' };

    // ---------- 브라우저 저장소 (사생활 보호 모드 등에서 실패해도 동작하도록) ----------

    function readStore(type, key) {
      try { return JSON.parse(window[type].getItem(key)); } catch { return null; }
    }

    function writeStore(type, key, value) {
      try { window[type].setItem(key, JSON.stringify(value)); } catch { /* 저장소를 쓸 수 없는 환경 */ }
    }

    function removeStore(type, key) {
      try { window[type].removeItem(key); } catch { /* 저장소를 쓸 수 없는 환경 */ }
    }

    // ---------- 학습 기록 저장 ----------
    // items: { "fe-1": { level: "review" | "done", memo: "...", memoAt: 1761379200000 } }
    // memoRepo: { id, fullName: "owner/name", defaultBranch } (GitHub 로그인 사용자만)
    // 미학습은 level이 없는 상태다. patch의 null은 해당 필드를 지운다는 뜻이다.

    function applyPatch(items, patch) {
      for (const [id, fields] of Object.entries(patch)) {
        const item = { ...items[id] };
        for (const [key, value] of Object.entries(fields)) {
          if (value === null) delete item[key];
          else item[key] = value;
        }
        if (Object.keys(item).length) items[id] = item;
        else delete items[id];
      }
    }

    const localBackend = {
      async load() {
        return { items: readStore('localStorage', LOCAL_KEY) || {}, memoRepo: null };
      },
      async write(patch) {
        const items = readStore('localStorage', LOCAL_KEY) || {};
        applyPatch(items, patch);
        writeStore('localStorage', LOCAL_KEY, items);
      },
      clear() {
        removeStore('localStorage', LOCAL_KEY);
      },
    };

    // Firestore: 사용자당 문서 1개(users/{uid}) → 접속 시 읽기 1회, 변경은 필드 단위 merge 쓰기
    function createFirestoreBackend(uid) {
      const ref = fb.fs.doc(fb.db, 'users', uid);
      const cacheKey = `maeil-cache-${uid}`;
      const remember = (snapshot) => writeStore('sessionStorage', cacheKey, { at: Date.now(), ...snapshot });

      return {
        async load() {
          const cached = readStore('sessionStorage', cacheKey);
          if (cached && Date.now() - cached.at < CACHE_TTL) {
            return { items: cached.items, memoRepo: cached.memoRepo || null };
          }

          const snap = await fb.fs.getDoc(ref);
          const doc = snap.exists() ? snap.data() : {};
          const items = {};
          for (const [id, item] of Object.entries(doc.items || {})) {
            if (Object.keys(item).length) items[id] = item;
          }
          const loaded = { items, memoRepo: doc.memoRepo || null };
          remember(loaded);
          return loaded;
        },
        async write(patch, snapshot) {
          const changes = {};
          for (const [id, fields] of Object.entries(patch)) {
            changes[id] = {};
            for (const [key, value] of Object.entries(fields)) {
              changes[id][key] = value === null ? fb.fs.deleteField() : value;
            }
          }
          await fb.fs.setDoc(ref, { items: changes }, { merge: true });
          remember(snapshot);
        },
        async saveMemoRepo(repo, snapshot) {
          await fb.fs.setDoc(ref, { memoRepo: repo }, { mergeFields: ['memoRepo'] });
          remember(snapshot);
        },
        forget() {
          removeStore('sessionStorage', cacheKey);
        },
      };
    }

    const store = {
      backend: localBackend,
      items: {},
      memoRepo: null,
      pending: {},
      saving: null,
      timer: 0,

      item(id) {
        return this.items[id] || {};
      },

      level(id) {
        return this.item(id).level || 'new';
      },

      async use(backend) {
        clearTimeout(this.timer);
        this.backend = backend;
        const { items, memoRepo } = await backend.load();
        this.items = items;
        this.memoRepo = memoRepo;
        this.pending = {};
      },

      async setMemoRepo(repo) {
        await this.backend.saveMemoRepo(repo, { items: this.items, memoRepo: repo });
        this.memoRepo = repo;
      },

      update(id, fields) {
        applyPatch(this.items, { [id]: fields });
        this.pending[id] = { ...this.pending[id], ...fields };
      },

      async flush() {
        clearTimeout(this.timer);
        while (this.saving) await this.saving;

        const patch = this.pending;
        if (!Object.keys(patch).length) return;
        this.pending = {};

        const writing = this.backend.write(patch, { items: this.items, memoRepo: this.memoRepo });
        this.saving = writing.catch(() => {}).finally(() => { this.saving = null; });
        try {
          await writing;
        } catch (err) {
          // 실패한 변경은 대기열로 되돌린다. 그사이 생긴 더 새로운 변경이 우선한다.
          for (const [id, fields] of Object.entries(patch)) {
            this.pending[id] = { ...fields, ...this.pending[id] };
          }
          throw err;
        }
      },

      get busy() {
        return this.saving !== null || Object.keys(this.pending).length > 0;
      },
    };

    let saveErrorShown = false;

    function flushInBackground() {
      store.flush()
        .then(() => { saveErrorShown = false; })
        .catch((err) => {
          console.error(err);
          if (!saveErrorShown) toast('저장하지 못했어요. 연결되면 자동으로 다시 저장할게요.', 'error');
          saveErrorShown = true;
          store.timer = setTimeout(flushInBackground, RETRY_DELAY);
        });
    }

    function saveSoon() {
      clearTimeout(store.timer);
      store.timer = setTimeout(flushInBackground, LEVEL_SAVE_DELAY);
    }

    // ---------- Firebase ----------

    async function loadFirebase() {
      const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
      const [app, auth, fs] = await Promise.all([
        import(`${base}/firebase-app.js`),
        import(`${base}/firebase-auth.js`),
        import(`${base}/firebase-firestore-lite.js`),
      ]);
      const instance = app.initializeApp(firebaseConfig);
      return { auth, fs, authInstance: auth.getAuth(instance), db: fs.getFirestore(instance) };
    }

    async function initData() {
      if (!firebaseConfig.apiKey || !firebaseConfig.projectId) {
        await store.use(localBackend);
        renderAccount({ mode: 'unconfigured' });
        return;
      }

      try {
        fb = await loadFirebase();
      } catch (err) {
        console.error(err);
        await store.use(localBackend);
        renderAccount({ mode: 'unavailable' });
        return;
      }

      await new Promise((resolve) => {
        fb.auth.onAuthStateChanged(fb.authInstance, async (user) => {
          await switchUser(user);
          resolve();
        });
      });
    }

    async function switchUser(user) {
      await store.flush().catch(() => {});
      store.backend.forget?.();
      currentUser = user;
      repoCache = null;

      if (!user) {
        await store.use(localBackend);
        renderAccount({ mode: 'guest' });
      } else {
        try {
          await store.use(createFirestoreBackend(user.uid));
          await moveLocalItems();
          renderAccount({ mode: 'user', user });
        } catch (err) {
          console.error(err);
          await store.use(localBackend);
          renderAccount({ mode: 'error', user });
        }
      }

      if (rows.size) renderAll();
    }

    // 로그인 전에 이 브라우저에 쌓인 기록을 계정으로 옮긴다 (계정에 이미 있는 필드는 계정 쪽을 유지)
    async function moveLocalItems() {
      const { items: local } = await localBackend.load();
      const moved = [];
      for (const [id, item] of Object.entries(local)) {
        const remote = store.items[id] || {};
        const fields = Object.fromEntries(Object.entries(item).filter(([key]) => !(key in remote)));
        if (Object.keys(fields).length) moved.push([id, fields]);
      }
      if (moved.length) {
        for (const [id, fields] of moved) store.update(id, fields);
        await store.flush();
        toast(`이 브라우저에 있던 기록 ${moved.length}개를 계정으로 옮겼어요.`);
      }
      localBackend.clear();
    }

    async function login() {
      try {
        rememberGithubToken(await fb.auth.signInWithPopup(fb.authInstance, new fb.auth.GithubAuthProvider()));
      } catch (err) {
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
        console.error(err);
        const hint = err.code === 'auth/unauthorized-domain'
          ? 'Firebase 승인 도메인에 이 주소를 추가해주세요.'
          : (err.code || '');
        toast(`로그인하지 못했어요. ${hint}`, 'error');
      }
    }

    async function logout() {
      if (hasDirtyEditor() && !confirm('저장하지 않은 메모가 있어요. 로그아웃할까요?')) return;
      await store.flush().catch(() => {});
      removeStore('localStorage', githubTokenKey(currentUser.uid));
      await fb.auth.signOut(fb.authInstance);
    }

    // ---------- GitHub ----------

    const githubTokenKey = (uid) => `maeil-github-token-${uid}`;

    // Firebase는 GitHub 토큰을 로그인하는 순간에만 넘겨주므로 이 기기에 보관해 둔다
    function rememberGithubToken(result) {
      const token = fb.auth.GithubAuthProvider.credentialFromResult(result)?.accessToken || null;
      if (token) writeStore('localStorage', githubTokenKey(result.user.uid), token);
      return token;
    }

    // 이미 승인한 계정이면 GitHub 동의 화면 없이 바로 돌아온다
    async function connectGithub() {
      const result = await fb.auth.reauthenticateWithPopup(fb.authInstance.currentUser, new fb.auth.GithubAuthProvider());
      return rememberGithubToken(result);
    }

    function getGithubToken() {
      const token = readStore('localStorage', githubTokenKey(currentUser.uid));
      return token ? Promise.resolve(token) : connectGithub();
    }

    async function githubApi(token, path, { method = 'GET', body } = {}) {
      const res = await fetch(`https://api.github.com${path}`, {
        method,
        cache: 'no-store', // 커밋 직후 다시 읽을 때 오래된 sha를 받지 않도록
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: `Bearer ${token}`,
          'X-GitHub-Api-Version': '2022-11-28',
          ...(body && { 'Content-Type': 'application/json' }),
        },
        body: body && JSON.stringify(body),
      });
      if (res.status === 401) {
        removeStore('localStorage', githubTokenKey(currentUser.uid));
        throw Object.assign(new Error('GitHub 토큰이 만료됐어요.'), { code: 'github/unauthorized' });
      }
      if (!res.ok) {
        const { message } = await res.json().catch(() => ({}));
        throw Object.assign(new Error(message || `GitHub API ${res.status}`), { status: res.status });
      }
      return res.json();
    }

    function toBase64(text) {
      let binary = '';
      for (const byte of new TextEncoder().encode(text)) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    // 메모를 선택한 저장소의 main 브랜치에 {id}.md로 커밋한다. 커밋 작성자는 토큰 주인(사용자)이다.
    async function commitMemo(token, id, text) {
      const path = `/repos/${store.memoRepo.fullName}/contents/${id}.md`;
      const title = data.questions.find((q) => q.id === id)?.title || '';

      for (let attempt = 0; ; attempt++) {
        let sha = null;
        let emptyRepo = false;
        try {
          ({ sha } = await githubApi(token, `${path}?ref=${MEMO_BRANCH}`));
        } catch (err) {
          if (err.status !== 404) throw err;
          emptyRepo = err.message === 'This repository is empty.';
        }

        try {
          await githubApi(token, path, {
            method: 'PUT',
            body: {
              message: `${sha ? '메모 수정' : '메모 추가'}: ${id.toUpperCase()} ${title}`.trim(),
              content: toBase64(`${text}\n`),
              // 빈 저장소는 브랜치가 아직 없어서 지정하지 않는다. 첫 커밋이 기본 브랜치를 만든다.
              ...(!emptyRepo && { branch: MEMO_BRANCH }),
              ...(sha && { sha }),
            },
          });
          return;
        } catch (err) {
          // 다른 기기에서 그사이 커밋해 sha가 바뀌었으면 한 번 더 시도한다
          if (err.status !== 409 || attempt > 0) throw err;
        }
      }
    }

    function githubErrorMessage(err) {
      if (err.code === 'github/unauthorized') return 'GitHub 연결이 만료됐어요. 다시 저장하면 다시 연결해요.';
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return 'GitHub 연결을 취소했어요.';
      if (err.code === 'auth/popup-blocked') return '팝업이 차단됐어요. 다시 저장해주세요.';
      if (/branch|ref/i.test(err.message)) return `${MEMO_BRANCH} 브랜치를 찾을 수 없어요.`;
      if (err.status === 403 || err.status === 404) return '저장소에 접근할 수 없어요. 앱에 저장소가 추가돼 있는지 확인해주세요.';
      return 'GitHub에 커밋하지 못했어요.';
    }

    const canCommit = () => accountMode === 'user' && Boolean(store.memoRepo);

    // 앱을 설치한 저장소 중 잔디가 심어지는 것만 보여준다: 포크·보관 저장소 제외
    async function listInstalledRepos(token) {
      const { installations } = await githubApi(token, '/user/installations?per_page=100');
      const repos = [];
      for (const installation of installations) {
        for (let page = 1; page <= 10; page++) {
          const { repositories } = await githubApi(token, `/user/installations/${installation.id}/repositories?per_page=100&page=${page}`);
          repos.push(...repositories);
          if (repositories.length < 100) break;
        }
      }
      return repos
        .filter((repo) => !repo.fork && !repo.archived)
        .map((repo) => ({
          id: repo.id,
          fullName: repo.full_name,
          defaultBranch: repo.default_branch,
          description: repo.description || '',
        }));
    }

    // ---------- 메모 저장소 선택 ----------

    function renderRepoCard() {
      els.repoCard.hidden = accountMode !== 'user';
      if (els.repoCard.hidden) return;

      const repo = store.memoRepo;
      els.repoCardValue.replaceChildren();
      els.repoCardValue.classList.toggle('is-empty', !repo);
      if (repo) {
        const link = document.createElement('a');
        link.href = `https://github.com/${repo.fullName}`;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = repo.fullName;
        els.repoCardValue.append(link);
      } else {
        els.repoCardValue.textContent = '아직 선택하지 않았어요';
      }
      els.repoOpen.textContent = repo ? '변경' : '저장소 선택';
    }

    function renderRepoState(message, action) {
      const state = document.createElement('div');
      state.className = 'repo-state';
      const text = document.createElement('span');
      text.textContent = message;
      state.append(text);
      if (action) {
        const button = document.createElement(action.href ? 'a' : 'button');
        button.className = 'btn btn-sm btn-primary';
        if (action.href) {
          button.href = action.href;
        } else {
          button.type = 'button';
          button.dataset.action = action.name;
        }
        button.textContent = action.label;
        state.append(button);
      }
      els.repoBody.replaceChildren(state);
    }

    function renderRepoList() {
      if (!repoCache.length) {
        renderRepoState(
          '아직 앱에 추가한 저장소가 없어요. 메모를 남길 저장소를 앱에 추가해주세요.',
          { href: GITHUB_APP_INSTALL_URL, label: 'GitHub에서 저장소 추가' },
        );
        return;
      }

      const term = normalize(els.repoSearch.value);
      const repos = repoCache.filter((repo) => !term || normalize(`${repo.fullName} ${repo.description}`).includes(term));
      if (!repos.length) {
        renderRepoState('검색 결과가 없어요.');
        return;
      }

      const list = document.createElement('ul');
      list.className = 'repo-list';
      for (const repo of repos) {
        const selected = store.memoRepo?.id === repo.id;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'repo-item';
        button.dataset.repoId = repo.id;
        button.setAttribute('aria-pressed', String(selected));

        const name = document.createElement('span');
        name.className = 'repo-name';
        name.textContent = repo.fullName;
        button.append(name);
        if (repo.description) {
          const description = document.createElement('span');
          description.className = 'repo-desc';
          description.textContent = repo.description;
          button.append(description);
        }
        if (selected) {
          const check = document.createElement('span');
          check.className = 'repo-check';
          check.textContent = '선택됨';
          button.append(check);
        }

        const item = document.createElement('li');
        item.append(button);
        list.append(item);
      }
      els.repoBody.replaceChildren(list);
    }

    async function loadRepos(token, { force = false } = {}) {
      if (repoCache && !force) {
        renderRepoList();
        return;
      }
      renderRepoState('저장소를 불러오는 중…');
      try {
        repoCache = await listInstalledRepos(token);
        renderRepoList();
      } catch (err) {
        console.error(err);
        if (err.code === 'github/unauthorized') {
          renderRepoState('GitHub 연결이 만료됐어요. 다시 연결해주세요.', { name: 'repo-connect', label: 'GitHub 다시 연결' });
        } else {
          renderRepoState('저장소 목록을 불러오지 못했어요.', { name: 'repo-refresh', label: '다시 시도' });
        }
      }
    }

    // 팝업 차단을 피하려면 클릭 직후 동기적으로 팝업을 열어야 한다
    async function connectAndLoad() {
      renderRepoState('GitHub 창에서 계속해주세요…');
      try {
        const token = await connectGithub();
        if (!token) throw new Error('GitHub 토큰을 받지 못했어요.');
        await loadRepos(token, { force: true });
      } catch (err) {
        const connect = { name: 'repo-connect', label: 'GitHub 연결' };
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
          renderRepoState('저장소 목록을 보려면 GitHub 연결이 필요해요.', connect);
        } else if (err.code === 'auth/popup-blocked') {
          renderRepoState('팝업이 차단됐어요. 버튼을 눌러 다시 시도해주세요.', connect);
        } else if (err.code === 'auth/user-mismatch') {
          renderRepoState('지금 로그인한 GitHub 계정으로 연결해주세요.', connect);
        } else {
          console.error(err);
          renderRepoState('GitHub에 연결하지 못했어요.', connect);
        }
      }
    }

    function loadReposOrConnect(options) {
      const token = readStore('localStorage', githubTokenKey(currentUser.uid));
      if (token) loadRepos(token, options);
      else connectAndLoad();
    }

    function openRepoDialog() {
      els.repoSearch.value = '';
      els.repoDialog.showModal();
      loadReposOrConnect();
    }

    async function selectRepo(id) {
      const repo = repoCache.find((candidate) => String(candidate.id) === id);
      if (!repo) return;
      if (store.memoRepo?.id === repo.id) {
        els.repoDialog.close();
        return;
      }

      try {
        await store.setMemoRepo({ id: repo.id, fullName: repo.fullName, defaultBranch: repo.defaultBranch });
        renderRepoCard();
        els.repoDialog.close();
        // 잔디는 기본 브랜치 커밋만 집계되므로, 기본 브랜치가 main이 아니면 알려준다
        if (repo.defaultBranch !== MEMO_BRANCH) {
          toast(`${repo.fullName}의 기본 브랜치가 ${repo.defaultBranch}예요. ${MEMO_BRANCH}에 커밋하면 잔디가 심어지지 않을 수 있어요.`, 'error', 6000);
        } else {
          toast(`메모 저장소를 ${repo.fullName}(으)로 정했어요.`);
        }
      } catch (err) {
        console.error(err);
        toast('저장소를 저장하지 못했어요. Firestore 규칙이 최신인지 확인해주세요.', 'error');
      }
    }

    // ---------- 질문 목록 ----------

    async function fetchText(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      return res.text();
    }

    async function loadQuestions() {
      const [toc, categoryToc, progress] = await Promise.all([
        fetchText('frontend/toc.md'),
        fetchText('frontend/toc-category.md').catch(() => ''),
        fetchText('progress.txt').catch(() => ''),
      ]);

      const categoryOf = {};
      const categories = [];
      let current = '';
      for (const line of categoryToc.split('\n')) {
        const heading = line.match(/^##\s+(.+)/);
        if (heading) {
          current = heading[1].trim();
          categories.push(current);
          continue;
        }
        const item = line.match(/\(contents\/(fe-\d+)\.md\)/);
        if (item && current) categoryOf[item[1]] = current;
      }

      // send_mail.py와 같은 형식: - [질문](contents/fe-1.md)
      const questions = [...toc.matchAll(/-\s*\[(.*?)\]\(contents\/(fe-\d+)\.md\)/g)]
        .map(([, title, id]) => ({ id, title, category: categoryOf[id] || '' }));

      // progress.txt는 지금까지 발송한 질문 수
      const sent = parseInt(progress, 10);
      const today = sent > 0 ? questions[sent - 1] || null : null;

      return { questions, categories, today, todayNum: sent };
    }

    // ---------- 렌더링 ----------

    function renderAccount(state) {
      const { mode, user } = state;
      const name = user ? user.displayName || user.email || 'GitHub 사용자' : '';
      const messages = {
        unconfigured: '이 브라우저에만 저장돼요 · Firebase를 설정하면 기기 간 동기화가 켜져요',
        unavailable: 'Firebase를 불러오지 못해 이 브라우저에만 저장하고 있어요',
        guest: '이 브라우저에만 저장돼요 · 로그인하면 다른 기기에서도 이어서 볼 수 있어요',
        user: `${name} 계정에 저장돼요`,
        error: '계정 기록을 불러오지 못해 이 브라우저에 임시로 저장하고 있어요',
      };
      accountMode = mode;
      renderRepoCard();
      els.syncText.textContent = messages[mode];
      els.syncStatus.dataset.state = mode === 'user' ? 'synced' : mode === 'error' || mode === 'unavailable' ? 'error' : 'local';

      els.account.replaceChildren();
      if (mode === 'guest') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-primary';
        button.innerHTML = `${GITHUB_ICON}<span>GitHub로 로그인</span>`;
        button.addEventListener('click', login);
        els.account.append(button);
      } else if (user) {
        const info = document.createElement('span');
        info.className = 'account-user';
        if (user.photoURL) {
          const avatar = document.createElement('img');
          avatar.src = user.photoURL;
          avatar.alt = '';
          info.append(avatar);
        }
        const label = document.createElement('span');
        label.className = 'account-name';
        label.textContent = name;
        info.append(label);

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn';
        button.textContent = '로그아웃';
        button.addEventListener('click', logout);
        els.account.append(info, button);
      }
    }

    function renderSkeleton() {
      els.list.innerHTML = Array.from({ length: 6 }, () => `
        <li class="q-row">
          <div class="skeleton skeleton-line" style="width: 48px;"></div>
          <div class="skeleton skeleton-line" style="width: 70%; height: 18px;"></div>
          <div class="skeleton skeleton-line" style="width: 30%;"></div>
        </li>`).join('');
    }

    function renderCategories() {
      const counts = {};
      for (const q of data.questions) counts[q.category] = (counts[q.category] || 0) + 1;
      for (const category of data.categories) {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = `${category} (${counts[category] || 0})`;
        els.category.append(option);
      }
    }

    function createRow(q) {
      const row = els.rowTemplate.content.firstElementChild.cloneNode(true);
      row.dataset.id = q.id;
      row.querySelector('.q-id').textContent = q.id.toUpperCase();
      const link = row.querySelector('.q-title');
      link.href = `questions/?q=${q.id}`;
      link.textContent = q.title;
      row.querySelector('.q-cat').textContent = q.category;
      return row;
    }

    function renderAll() {
      rows.clear();
      const fragment = document.createDocumentFragment();
      for (const q of data.questions) {
        const row = createRow(q);
        rows.set(q.id, row);
        fragment.append(row);
        updateRow(q.id);
      }
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.id = 'empty';
      empty.textContent = '조건에 맞는 질문이 없어요.';
      empty.hidden = true;
      fragment.append(empty);

      els.list.replaceChildren(fragment);
      renderToday();
      updateStats();
      applyFilter();
    }

    function updateRow(id) {
      const row = rows.get(id);
      if (!row) return;
      const item = store.item(id);
      const level = item.level || 'new';

      row.dataset.state = level;
      for (const button of row.querySelectorAll('.level-seg button')) {
        button.setAttribute('aria-pressed', String(button.dataset.level === level));
      }

      const preview = row.querySelector('.q-memo-preview');
      preview.textContent = item.memo ? item.memo.replace(/\s+/g, ' ') : '';
      preview.hidden = !item.memo;
      row.querySelector('.memo-btn').classList.toggle('has-memo', Boolean(item.memo));
    }

    function renderToday() {
      const q = data.today;
      els.today.hidden = !q;
      if (!q) return;
      els.today.href = `questions/?q=${q.id}`;
      els.todayNum.textContent = data.todayNum;
      els.todayTitle.textContent = q.title;
    }

    function updateStats() {
      const counts = { all: data.questions.length, new: 0, review: 0, done: 0 };
      for (const q of data.questions) counts[store.level(q.id)]++;
      for (const [key, value] of Object.entries(counts)) {
        els.stats.querySelector(`[data-count="${key}"]`).textContent = value;
      }

      const percent = (n) => (counts.all ? (n / counts.all) * 100 : 0);
      els.progressDone.style.width = `${percent(counts.done)}%`;
      els.progressReview.style.width = `${percent(counts.review)}%`;
      els.progressText.textContent = `${counts.all}개 중 ${counts.done}개 완벽 이해 (${Math.round(percent(counts.done))}%)`;
    }

    const normalize = (text) => text.toLowerCase().replace(/\s+/g, '');

    // 학습 수준을 바꿀 때는 다시 거르지 않는다. 필터 중인 행이 눈앞에서 사라지지 않도록.
    function applyFilter() {
      const term = normalize(filter.text);
      let shown = 0;
      for (const q of data.questions) {
        const item = store.item(q.id);
        const visible = (filter.level === 'all' || filter.level === (item.level || 'new'))
          && (!filter.category || q.category === filter.category)
          && (!term || normalize(`${q.id} ${q.title} ${item.memo || ''}`).includes(term));
        rows.get(q.id).hidden = !visible;
        if (visible) shown++;
      }
      document.getElementById('empty').hidden = shown > 0;
      els.resultCount.textContent = `질문 ${shown}개`;
    }

    // ---------- 학습 수준 & 메모 ----------

    function setLevel(id, level) {
      if (store.level(id) === level) return;
      store.update(id, { level: level === 'new' ? null : level });
      updateRow(id);
      updateStats();
      saveSoon();
    }

    function editorOf(row) {
      return row.querySelector('.memo-editor');
    }

    // 고친 내용이 있거나, 저장은 됐지만 GitHub 커밋이 실패해 다시 올려야 하는 상태
    function isDirty(row) {
      const textarea = editorOf(row)?.querySelector('textarea');
      if (!textarea) return false;
      const text = textarea.value.trim();
      return text !== (store.item(row.dataset.id).memo || '') || (Boolean(text) && uncommitted.has(row.dataset.id));
    }

    function hasDirtyEditor() {
      return [...rows.values()].some(isDirty);
    }

    function autosize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight + 2}px`;
    }

    const dateFormat = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    function updateEditor(row) {
      const editor = editorOf(row);
      if (!editor) return;
      const item = store.item(row.dataset.id);
      editor.querySelector('.memo-count').textContent = `${editor.querySelector('textarea').value.length} / ${MEMO_MAX}`;
      editor.querySelector('.memo-saved').textContent = item.memoAt
        ? `마지막 저장 ${dateFormat.format(item.memoAt)}`
        : '';

      const github = editor.querySelector('.memo-github');
      const failed = uncommitted.has(row.dataset.id);
      github.classList.toggle('is-error', failed);
      github.textContent = !canCommit() || !editor.querySelector('textarea').value.trim() ? ''
        : failed ? 'GitHub에 아직 올리지 못했어요 · 다시 저장해주세요'
        : `저장하면 ${store.memoRepo.fullName}의 ${row.dataset.id}.md로 커밋돼요`;

      editor.querySelector('[data-action="memo-save"]').disabled = !isDirty(row);
    }

    function openEditor(row) {
      const editor = els.editorTemplate.content.firstElementChild.cloneNode(true);
      const textarea = editor.querySelector('textarea');
      textarea.maxLength = MEMO_MAX;
      textarea.value = store.item(row.dataset.id).memo || '';
      textarea.setAttribute('aria-label', `${row.dataset.id.toUpperCase()} 메모`);

      row.append(editor);
      row.querySelector('.memo-btn').setAttribute('aria-expanded', 'true');
      updateEditor(row);
      autosize(textarea);
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }

    function closeEditor(row) {
      const editor = editorOf(row);
      if (!editor) return;
      if (isDirty(row) && !confirm('저장하지 않은 메모가 있어요. 닫을까요?')) return;
      editor.remove();
      const memoButton = row.querySelector('.memo-btn');
      memoButton.setAttribute('aria-expanded', 'false');
      memoButton.focus();
    }

    async function saveMemo(row) {
      const id = row.dataset.id;
      const editor = editorOf(row);
      const textarea = editor.querySelector('textarea');
      const saveButton = editor.querySelector('[data-action="memo-save"]');
      const text = textarea.value.trim();
      const changed = text !== (store.item(id).memo || '');
      // 메모를 지울 때는 GitHub 파일을 그대로 둔다 (학습 기록으로 남긴다)
      const shouldCommit = Boolean(text) && canCommit() && (changed || uncommitted.has(id));

      textarea.value = text;
      saveButton.disabled = true;
      saveButton.textContent = '저장 중…';
      if (changed) {
        store.update(id, text ? { memo: text, memoAt: Date.now() } : { memo: null, memoAt: null });
        updateRow(id);
      }

      // 토큰이 없으면 클릭 직후 팝업을 열어야 하므로 Firestore 저장과 GitHub 커밋을 함께 시작한다
      const [saved, committed] = await Promise.allSettled([
        changed ? store.flush() : Promise.resolve(),
        shouldCommit ? getGithubToken().then((token) => commitMemo(token, id, text)) : Promise.resolve(),
      ]);

      if (shouldCommit) {
        if (committed.status === 'fulfilled') uncommitted.delete(id);
        else uncommitted.add(id);
      }

      if (saved.status === 'rejected') {
        console.error(saved.reason);
        toast('메모를 저장하지 못했어요. 연결되면 자동으로 다시 저장할게요.', 'error');
        saveErrorShown = true;
        store.timer = setTimeout(flushInBackground, RETRY_DELAY);
      } else if (committed.status === 'rejected') {
        console.error(committed.reason);
        toast(`메모는 저장했지만 GitHub에 올리지 못했어요. ${githubErrorMessage(committed.reason)}`, 'error', 5000);
      } else {
        saveErrorShown = false;
        toast(shouldCommit
          ? `메모를 저장하고 ${store.memoRepo.fullName}에 커밋했어요.`
          : text ? '메모를 저장했어요.' : '메모를 지웠어요.');
      }

      saveButton.textContent = '저장';
      updateEditor(row);
    }

    // ---------- 기타 ----------

    let toastTimer = 0;

    function toast(message, tone = 'info', duration = 2800) {
      els.toast.textContent = message;
      els.toast.dataset.tone = tone;
      els.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), duration);
    }

    function initTheme() {
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        if (nextTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('theme', nextTheme); } catch { /* 저장소를 쓸 수 없는 환경 */ }
      });
    }

    function bindEvents() {
      els.list.addEventListener('click', (e) => {
        const row = e.target.closest('.q-row');
        if (!row || !row.dataset.id) return;

        const levelButton = e.target.closest('.level-seg button');
        if (levelButton) {
          setLevel(row.dataset.id, levelButton.dataset.level);
          return;
        }

        const action = e.target.closest('[data-action]')?.dataset.action;
        if (action === 'memo') editorOf(row) ? closeEditor(row) : openEditor(row);
        else if (action === 'memo-close') closeEditor(row);
        else if (action === 'memo-save') saveMemo(row);
      });

      els.list.addEventListener('input', (e) => {
        if (!e.target.matches('.memo-editor textarea')) return;
        autosize(e.target);
        updateEditor(e.target.closest('.q-row'));
      });

      els.list.addEventListener('keydown', (e) => {
        if (!e.target.matches('.memo-editor textarea')) return;
        const row = e.target.closest('.q-row');
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          if (isDirty(row)) saveMemo(row);
        } else if (e.key === 'Escape') {
          closeEditor(row);
        }
      });

      els.stats.addEventListener('click', (e) => {
        const button = e.target.closest('[data-filter]');
        if (!button) return;
        filter.level = button.dataset.filter;
        for (const stat of els.stats.querySelectorAll('[data-filter]')) {
          stat.setAttribute('aria-pressed', String(stat === button));
        }
        applyFilter();
      });

      els.search.addEventListener('input', () => {
        filter.text = els.search.value;
        applyFilter();
      });

      els.category.addEventListener('change', () => {
        filter.category = els.category.value;
        applyFilter();
      });

      els.repoOpen.addEventListener('click', openRepoDialog);

      els.repoDialog.addEventListener('click', (e) => {
        // 바깥(배경)을 누르면 닫는다
        if (e.target === els.repoDialog) {
          els.repoDialog.close();
          return;
        }

        const repoButton = e.target.closest('.repo-item');
        if (repoButton) {
          selectRepo(repoButton.dataset.repoId);
          return;
        }

        const action = e.target.closest('[data-action]')?.dataset.action;
        if (action === 'repo-close') els.repoDialog.close();
        else if (action === 'repo-connect') connectAndLoad();
        else if (action === 'repo-refresh') loadReposOrConnect({ force: true });
      });

      els.repoSearch.addEventListener('input', () => {
        if (repoCache) renderRepoList();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || els.repoDialog.open) return;
        if (e.target.closest('input, textarea, select, [contenteditable]')) return;
        e.preventDefault();
        els.search.focus();
      });

      // 질문을 열기 전에 아직 쓰지 않은 변경을 먼저 저장한다
      document.addEventListener('click', async (e) => {
        const link = e.target.closest('a.q-link');
        if (!link || !store.busy || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        await Promise.race([
          store.flush().catch(() => {}),
          new Promise((resolve) => setTimeout(resolve, 2000)),
        ]);
        location.href = link.href;
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && store.busy) store.flush().catch(() => {});
      });

      window.addEventListener('beforeunload', (e) => {
        if (store.busy || hasDirtyEditor()) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    }

    async function main() {
      initTheme();
      renderSkeleton();
      els.repoCard.querySelector('.repo-card-icon').innerHTML = GITHUB_ICON;
      document.getElementById('repo-install-link').href = GITHUB_APP_INSTALL_URL;

      const dataReady = initData();
      try {
        data = await loadQuestions();
      } catch (err) {
        console.error(err);
        els.list.innerHTML = '<li class="empty">질문 목록을 불러오지 못했어요. 잠시 후 새로고침해주세요.</li>';
        return;
      }
      await dataReady;

      // 뒤로가기로 돌아왔을 때 브라우저가 복원한 입력값을 반영한다
      filter.text = els.search.value;
      renderCategories();
      filter.category = els.category.value;
      bindEvents();
      renderAll();

      // GitHub 앱 설치를 마치고 돌아오면(Setup URL에 setup_action이 붙는다) 저장소 선택 창을 바로 연다
      if (new URLSearchParams(location.search).has('setup_action')) {
        history.replaceState(null, '', location.pathname);
        if (accountMode === 'user') openRepoDialog();
      }
    }

    main();
  </script>
</body>
</html>
