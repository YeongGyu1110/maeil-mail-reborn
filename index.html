<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매일메일 면접 뷰어</title>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 마크다운 파서 및 Prism.js 코드 하이라이터 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --border-color: #e5e8eb;
      --text-main: #191f28;
      --text-sub: #333d4b;
      --text-muted: #8b95a1;
      --primary: #00a86b;
      --primary-light: #e8f5e9;
      --code-inline-bg: #eaf5ee;
      --code-inline-color: #0b7a48;
      --table-header-bg: #f9fafb;
      --skeleton-base: #f0f2f5;
      --skeleton-highlight: #e4e7eb;
    }

    /* 스켈레톤 UI 애니메이션 */
    .skeleton {
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
      border-radius: 6px;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-badge {
      width: 96px;
      height: 25px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .skeleton-title {
      width: 75%;
      height: 32px;
      border-radius: 8px;
    }

    .skeleton-line {
      height: 16px;
      margin-bottom: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.75;
      letter-spacing: -0.02em;
      color: var(--text-sub);
      background-color: var(--bg-body);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 768px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 44px 48px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-color);
    }

    .badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    h1#question-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 24px 0;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 28px 0;
    }

    /* 마크다운 컨텐츠 타이포그래피 */
    #content {
      font-size: 16px;
      color: var(--text-sub);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    #content h2 {
      font-size: 21px;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 14px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    #content h3 {
      font-size: 18px;
      font-weight: 700;
      margin-top: 28px;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    #content h4 {
      font-size: 16px;
      font-weight: 600;
      margin-top: 22px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    #content p {
      margin: 16px 0;
    }

    #content strong {
      font-weight: 700;
      color: var(--text-main);
    }

    #content ul, #content ol {
      padding-left: 24px;
      margin: 16px 0;
    }

    #content li {
      margin-bottom: 6px;
    }

    #content li > p {
      margin: 6px 0;
    }

    #content blockquote {
      margin: 20px 0;
      padding: 12px 20px;
      border-left: 4px solid var(--primary);
      background: var(--bg-body);
      color: var(--text-sub);
      border-radius: 0 8px 8px 0;
    }

    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 15px;
    }

    #content th, #content td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    #content th {
      background: var(--table-header-bg);
      font-weight: 600;
      color: var(--text-main);
    }

    /* 인라인 코드: 기존 붉은색 대신 뱃지와 일관된 톤으로 조정 */
    #content code:not(pre code) {
      background: var(--code-inline-bg);
      color: var(--code-inline-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
    }

    .code-wrapper {
      position: relative;
      margin: 20px 0;
    }

    #content pre {
      border-radius: 10px;
      padding: 18px;
      overflow-x: auto;
      margin: 0;
      background: #2d2d2d;
    }

    .code-copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e5e8eb;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .code-copy-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .code-copy-btn.copied {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    #content a {
      color: var(--primary);
      text-decoration: none;
    }

    #content a:hover {
      text-decoration: underline;
    }

    /* 모바일 반응형 (640px 이하): 플랫 배경 및 컨텐츠 폭 극대화 */
    @media (max-width: 640px) {
      body {
        padding: 0;
        background-color: var(--bg-card); /* 바깥 배경을 화이트(플랫)로 통일 */
      }

      .container {
        padding: 24px 20px;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }

      h1#question-title {
        font-size: 22px;
        margin-bottom: 18px;
      }

      #content {
        font-size: 15.5px;
      }

      #content h2 { font-size: 19px; }
      #content h3 { font-size: 17px; }

      #content table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge" id="question-badge" style="display: none;"></div>
    <div class="skeleton skeleton-badge" id="badge-skeleton"></div>

    <h1 id="question-title"><div class="skeleton skeleton-title"></div></h1>
    <hr />
    <div id="content">
      <div class="skeleton skeleton-line" style="width: 90%;"></div>
      <div class="skeleton skeleton-line" style="width: 100%;"></div>
      <div class="skeleton skeleton-line" style="width: 78%;"></div>
      <div class="skeleton skeleton-line" style="width: 45%; margin-top: 24px;"></div>
      <div class="skeleton skeleton-line" style="width: 95%;"></div>
      <div class="skeleton skeleton-line" style="width: 82%;"></div>
    </div>
  </div>

  <script>
    async function loadContent() {
      const params = new URLSearchParams(window.location.search);
      let q = params.get('q') || 'fe-1';
      if (!q.startsWith('fe-')) q = 'fe-' + q;

      try {
        // frontend 폴더 내부 파일 참조
        const [tocRes, contentRes] = await Promise.all([
          fetch('frontend/toc.md'),
          fetch(`frontend/contents/${q}.md`)
        ]);

        if (!contentRes.ok) throw new Error("답변 파일을 찾을 수 없습니다.");

        const tocText = await tocRes.text();
        const contentMd = await contentRes.text();

        // 정규표현식으로 질문 추출 (예: contents/fe-1.md)
        const regex = new RegExp(`-\\s*\\[(.*?)\\]\\(contents/${q}\\.md\\)`);
        const match = tocText.match(regex);
        const questionTitle = match ? match[1] : q;

        // 뱃지 스켈레톤 숨기고 실제 뱃지 활성화
        document.getElementById('badge-skeleton').style.display = 'none';
        const badgeEl = document.getElementById('question-badge');
        badgeEl.style.display = 'inline-block';
        badgeEl.innerText = q.toUpperCase();

        document.getElementById('question-title').innerText = questionTitle;
        document.title = `${questionTitle} - 매일메일`;

        document.getElementById('content').innerHTML = marked.parse(contentMd);
        Prism.highlightAll();
        addCopyButtons();
      } catch (err) {
        document.getElementById('badge-skeleton').style.display = 'none';
        document.getElementById('question-title').innerText = "오류가 발생했습니다";
        document.getElementById('content').innerHTML = `<p style="color: red;">${err.message}</p>`;
      }
    }

    function addCopyButtons() {
      document.querySelectorAll('#content pre').forEach((pre) => {
        // 코드 블록을 relative 래퍼로 감싸 가로 스크롤 시에도 버튼 위치 고정
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = '복사';

        copyBtn.addEventListener('click', async () => {
          try {
            const code = pre.querySelector('code')?.innerText || pre.innerText;
            await navigator.clipboard.writeText(code);
            copyBtn.innerText = '복사됨!';
            copyBtn.classList.add('copied');

            setTimeout(() => {
              copyBtn.innerText = '복사';
              copyBtn.classList.remove('copied');
            }, 2000);
          } catch (err) {
            copyBtn.innerText = '실패';
          }
        });

        wrapper.appendChild(copyBtn);
      });
    }

    loadContent();
  </script>
</body>
</html>
