<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매일메일 면접 뷰어</title>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 마크다운 파서 및 Prism.js (고정 테마 CSS 제거 후 CSS 변수로 일원화) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --border-color: #e5e8eb;
      --text-main: #191f28;
      --text-sub: #333d4b;
      --text-muted: #8b95a1;
      --primary: #00a86b;
      --primary-light: #e8f5e9;
      --code-inline-bg: #eaf5ee;
      --code-inline-color: #0b7a48;
      --table-header-bg: #f9fafb;
      --skeleton-base: #f0f2f5;
      --skeleton-highlight: #e4e7eb;

      /* [라이트 테마] 코드 블록 & 복사 버튼 */
      --code-block-bg: #f6f8fa;
      --code-block-border: #e1e4e8;
      --code-block-text: #24292f;
      --code-btn-bg: rgba(0, 0, 0, 0.05);
      --code-btn-border: rgba(0, 0, 0, 0.1);
      --code-btn-text: #57606a;
      --code-btn-hover-bg: rgba(0, 0, 0, 0.1);
      --code-btn-hover-text: #24292f;

      /* [라이트 테마] 신택스 하이라이팅 (GitHub Light 톤) */
      --syntax-comment: #6e7781;
      --syntax-punctuation: #57606a;
      --syntax-keyword: #cf222e;
      --syntax-tag: #116329;
      --syntax-string: #0a3069;
      --syntax-number: #0550ae;
      --syntax-function: #8250df;
      --syntax-operator: #cf222e;
      --syntax-variable: #953800;
    }

    /* 다크 테마 팔레트 */
    [data-theme="dark"] {
      --bg-body: #111315;
      --bg-card: #181a1d;
      --border-color: #2c3138;
      --text-main: #f0f3f6;
      --text-sub: #c5cbd3;
      --text-muted: #767f8d;
      --primary: #00c47d;
      --primary-light: rgba(0, 196, 125, 0.16);
      --code-inline-bg: rgba(0, 196, 125, 0.14);
      --code-inline-color: #34d399;
      --table-header-bg: #202327;
      --skeleton-base: #24272c;
      --skeleton-highlight: #30353c;

      /* [다크 테마] 코드 블록 & 복사 버튼 */
      --code-block-bg: #121417;
      --code-block-border: #282c34;
      --code-block-text: #e6edf3;
      --code-btn-bg: rgba(255, 255, 255, 0.08);
      --code-btn-border: rgba(255, 255, 255, 0.15);
      --code-btn-text: #8b949e;
      --code-btn-hover-bg: rgba(255, 255, 255, 0.18);
      --code-btn-hover-text: #f0f6fc;

      /* [다크 테마] 신택스 하이라이팅 (GitHub / One Dark 톤) */
      --syntax-comment: #8b949e;
      --syntax-punctuation: #7d8590;
      --syntax-keyword: #ff7b72;
      --syntax-tag: #7ee787;
      --syntax-string: #a5d6ff;
      --syntax-number: #79c0ff;
      --syntax-function: #d2a8ff;
      --syntax-operator: #ff7b72;
      --syntax-variable: #ffa657;
    }

    /* 상단 헤더 바 & 테마 토글 버튼 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-bar .badge,
    .header-bar .skeleton-badge {
      margin-bottom: 0;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .theme-toggle-btn:hover {
      background-color: var(--table-header-bg);
      color: var(--text-main);
    }

    .sun-icon { display: none; }
    .moon-icon { display: block; }

    [data-theme="dark"] .sun-icon { display: block; }
    [data-theme="dark"] .moon-icon { display: none; }

    /* 스켈레톤 UI */
    .skeleton {
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease-in-out infinite;
      border-radius: 6px;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-badge {
      width: 96px;
      height: 25px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .skeleton-title {
      width: 75%;
      height: 32px;
      border-radius: 8px;
    }

    .skeleton-line {
      height: 16px;
      margin-bottom: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.75;
      letter-spacing: -0.02em;
      color: var(--text-sub);
      background-color: var(--bg-body);
      margin: 0;
      padding: 40px 20px;
      transition: background-color 0.2s;
    }

    .container {
      max-width: 768px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 44px 48px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, border-color 0.2s;
    }

    .badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    h1#question-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 24px 0;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 28px 0;
    }

    #content {
      font-size: 16px;
      color: var(--text-sub);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    #content h2 {
      font-size: 21px;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 14px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    #content h3 {
      font-size: 18px;
      font-weight: 700;
      margin-top: 28px;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    #content h4 {
      font-size: 16px;
      font-weight: 600;
      margin-top: 22px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    #content p { margin: 16px 0; }
    #content strong { font-weight: 700; color: var(--text-main); }
    #content ul, #content ol { padding-left: 24px; margin: 16px 0; }
    #content li { margin-bottom: 6px; }
    #content li > p { margin: 6px 0; }

    #content blockquote {
      margin: 20px 0;
      padding: 12px 20px;
      border-left: 4px solid var(--primary);
      background: var(--bg-body);
      color: var(--text-sub);
      border-radius: 0 8px 8px 0;
    }

    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 15px;
    }

    #content th, #content td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    #content th {
      background: var(--table-header-bg);
      font-weight: 600;
      color: var(--text-main);
    }

    /* 인라인 코드 */
    #content code:not(pre code) {
      background: var(--code-inline-bg);
      color: var(--code-inline-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* =========================================
       코드 블록 & 구문 하이라이팅 (개선 영역)
       ========================================= */
    .code-wrapper {
      position: relative;
      margin: 24px 0;
    }

    #content pre {
      background-color: var(--code-block-bg);
      border: 1px solid var(--code-block-border);
      border-radius: 10px;
      padding: 18px 20px;
      overflow-x: auto;
      margin: 0;
      color: var(--code-block-text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.65;
      tab-size: 2;
      transition: background-color 0.2s, border-color 0.2s;
    }

    #content pre code {
      font-family: inherit;
      color: inherit;
    }

    /* 스크롤바 미세 조정 */
    #content pre::-webkit-scrollbar {
      height: 6px;
    }
    #content pre::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    /* Prism.js 구문 토큰 색상 정의 */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
      color: var(--syntax-comment);
      font-style: italic;
    }

    .token.punctuation {
      color: var(--syntax-punctuation);
    }

    .token.property,
    .token.tag,
    .token.boolean,
    .token.constant,
    .token.symbol,
    .token.deleted {
      color: var(--syntax-tag);
    }

    .token.number {
      color: var(--syntax-number);
    }

    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin,
    .token.inserted {
      color: var(--syntax-string);
    }

    .token.operator,
    .token.entity,
    .token.url {
      color: var(--syntax-operator);
    }

    .token.atrule,
    .token.attr-value,
    .token.keyword {
      color: var(--syntax-keyword);
      font-weight: 600;
    }

    .token.function,
    .token.class-name {
      color: var(--syntax-function);
    }

    .token.regex,
    .token.important,
    .token.variable {
      color: var(--syntax-variable);
    }

    /* 코드 복사 버튼 */
    .code-copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--code-btn-bg);
      border: 1px solid var(--code-btn-border);
      color: var(--code-btn-text);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
      user-select: none;
    }

    .code-copy-btn:hover {
      background: var(--code-btn-hover-bg);
      color: var(--code-btn-hover-text);
    }

    .code-copy-btn.copied {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    #content a {
      color: var(--primary);
      text-decoration: none;
    }

    #content a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        background-color: var(--bg-card);
      }

      .container {
        padding: 24px 20px;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }

      h1#question-title {
        font-size: 22px;
        margin-bottom: 18px;
      }

      #content { font-size: 15.5px; }
      #content h2 { font-size: 19px; }
      #content h3 { font-size: 17px; }

      #content table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <div class="badge" id="question-badge" style="display: none;"></div>
        <div class="skeleton skeleton-badge" id="badge-skeleton"></div>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="테마 전환" type="button">
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>

    <h1 id="question-title"><div class="skeleton skeleton-title"></div></h1>
    <hr />
    <div id="content">
      <div class="skeleton skeleton-line" style="width: 90%;"></div>
      <div class="skeleton skeleton-line" style="width: 100%;"></div>
      <div class="skeleton skeleton-line" style="width: 78%;"></div>
      <div class="skeleton skeleton-line" style="width: 45%; margin-top: 24px;"></div>
      <div class="skeleton skeleton-line" style="width: 95%;"></div>
      <div class="skeleton skeleton-line" style="width: 82%;"></div>
    </div>
  </div>

  <script>
    async function loadContent() {
      const params = new URLSearchParams(window.location.search);
      let q = params.get('q') || 'fe-1';
      if (!q.startsWith('fe-')) q = 'fe-' + q;

      try {
        const [tocRes, contentRes] = await Promise.all([
          fetch('frontend/toc.md'),
          fetch(`frontend/contents/${q}.md`)
        ]);

        if (!contentRes.ok) throw new Error("답변 파일을 찾을 수 없습니다.");

        const tocText = await tocRes.text();
        const contentMd = await contentRes.text();

        const regex = new RegExp(`-\\s*\\[(.*?)\\]\\(contents/${q}\\.md\\)`);
        const match = tocText.match(regex);
        const questionTitle = match ? match[1] : q;

        document.getElementById('badge-skeleton').style.display = 'none';
        const badgeEl = document.getElementById('question-badge');
        badgeEl.style.display = 'inline-block';
        badgeEl.innerText = q.toUpperCase();

        document.getElementById('question-title').innerText = questionTitle;
        document.title = `${questionTitle} - 매일메일`;

        document.getElementById('content').innerHTML = marked.parse(contentMd);
        Prism.highlightAll();
        addCopyButtons();
      } catch (err) {
        document.getElementById('badge-skeleton').style.display = 'none';
        document.getElementById('question-title').innerText = "오류가 발생했습니다";
        document.getElementById('content').innerHTML = `<p style="color: red;">${err.message}</p>`;
      }
    }

    function addCopyButtons() {
      document.querySelectorAll('#content pre').forEach((pre) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.type = 'button';
        copyBtn.innerText = '복사';

        copyBtn.addEventListener('click', async () => {
          try {
            const code = pre.querySelector('code')?.innerText || pre.innerText;
            await navigator.clipboard.writeText(code);
            copyBtn.innerText = '복사됨!';
            copyBtn.classList.add('copied');

            setTimeout(() => {
              copyBtn.innerText = '복사';
              copyBtn.classList.remove('copied');
            }, 2000);
          } catch (err) {
            copyBtn.innerText = '실패';
          }
        });

        wrapper.appendChild(copyBtn);
      });
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');

      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const nextTheme = isDark ? 'light' : 'dark';

        if (nextTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        localStorage.setItem('theme', nextTheme);
      });
    }

    initTheme();
    loadContent();
  </script>
</body>
</html>
