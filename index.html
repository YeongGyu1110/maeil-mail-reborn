<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매일메일 면접 뷰어</title>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 마크다운 파서 및 Prism.js 코드 하이라이터 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.75;
      color: #333d4b;
      background-color: #f9fafb;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 768px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e8eb;
    }
    .badge {
      display: inline-block;
      background: #e8f5e9;
      color: #00a86b;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    h1#question-title {
      font-size: 26px;
      font-weight: 700;
      color: #191f28;
      margin: 0 0 24px 0;
      line-height: 1.4;
      word-break: keep-all;
    }
    hr {
      border: 0;
      border-top: 1px solid #e5e8eb;
      margin: 28px 0;
    }
    #content {
      font-size: 16px;
      color: #333d4b;
      word-break: keep-all;
    }
    #content h2 { font-size: 20px; margin-top: 36px; margin-bottom: 12px; color: #191f28; }
    #content p { margin: 16px 0; }
    #content code:not(pre code) {
      background: #f2f4f6;
      color: #eb5757;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    #content pre {
      border-radius: 8px;
      padding: 18px;
      overflow-x: auto;
      background: #2d2d2d;
    }
    #content a { color: #00a86b; text-decoration: none; }
    #content a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge" id="question-badge">FE INTERVIEW</div>
    <h1 id="question-title">질문을 불러오는 중...</h1>
    <hr />
    <div id="content">답변 내용을 불러오는 중입니다...</div>
  </div>

  <script>
    async function loadContent() {
      const params = new URLSearchParams(window.location.search);
      let q = params.get('q') || 'fe-1';
      if (!q.startsWith('fe-')) q = 'fe-' + q;

      try {
        // frontend 폴더 내부 파일 참조
        const [tocRes, contentRes] = await Promise.all([
          fetch('frontend/toc.md'),
          fetch(`frontend/contents/${q}.md`)
        ]);

        if (!contentRes.ok) throw new Error("답변 파일을 찾을 수 없습니다.");

        const tocText = await tocRes.text();
        const contentMd = await contentRes.text();

        // 정규표현식으로 질문 추출 (예: contents/fe-1.md)
        const regex = new RegExp(`-\\s*\\[(.*?)\\]\\(contents/${q}\\.md\\)`);
        const match = tocText.match(regex);
        const questionTitle = match ? match[1] : q;

        document.getElementById('question-badge').innerText = q.toUpperCase();
        document.getElementById('question-title').innerText = questionTitle;
        document.title = `${questionTitle} - 매일메일`;

        document.getElementById('content').innerHTML = marked.parse(contentMd);
        Prism.highlightAll();
      } catch (err) {
        document.getElementById('question-title').innerText = "오류가 발생했습니다";
        document.getElementById('content').innerHTML = `<p style="color: red;">${err.message}</p>`;
      }
    }
    loadContent();
  </script>
</body>
</html>
